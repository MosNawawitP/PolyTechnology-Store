<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body>
<x-dc>
  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title">{{ t.forgotTitle }}</h1>
    <p class="intro">{{ t.forgotIntro }}</p>
    <div aria-live="polite"><sc-if value="{{ sent }}"><p class="notice notice-info" role="status">{{ notice }}</p></sc-if></div>
    <sc-if value="{{ sent }}"><p class="helper"><button class="text-link" type="button" onClick="{{ openReset }}">{{ lblDemoReset }}</button></p></sc-if>
    <form class="auth-form" onSubmit="{{ submitForgot }}" noValidate="{{ true }}" aria-busy="{{ busy }}">
      <div class="field">
        <label for="staff-email">{{ t.email }}</label>
        <input id="staff-email" name="email" type="email" value="{{ email }}" onChange="{{ onField }}" placeholder="name@company.com" autoComplete="email" autoCapitalize="none" spellCheck="{{ false }}" required="{{ true }}" readOnly="{{ busy }}" aria-invalid="{{ emailInvalid }}" aria-describedby="email-error">
        <div id="email-error" aria-live="polite"><sc-if value="{{ emailInvalid }}"><p class="field-error">{{ emailError }}</p></sc-if></div>
      </div>
      <button class="primary" type="submit" disabled="{{ sendDisabled }}">{{ sendLabel }}</button>
    </form>
    <p class="helper"><button class="text-link" type="button" onClick="{{ backToLogin }}">{{ t.back }}</button></p>
    <p class="helper">{{ t.noEmail }}</p>
  </section>
</x-dc>
</body></html>
