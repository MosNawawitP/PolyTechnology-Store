<!DOCTYPE html><html><head><meta charset="utf-8"><script src="./support.js"></script></head><body><x-dc>
  <sc-for list="{{ fieldList }}" as="f"><div class="bo-form-field">
    <label for="{{ f.inputId }}">{{ f.label }} <sc-if value="{{ f.required }}"><span class="bo-required">*</span></sc-if></label>
    <sc-if value="{{ f.isText }}"><input id="{{ f.inputId }}" name="{{ f.key }}" type="{{ f.inputType }}" value="{{ f.value }}" onChange="{{ f.change }}" required="{{ f.required }}" disabled="{{ contentReadonly }}" aria-invalid="{{ f.hasError }}" aria-describedby="{{ f.inputId + '-error' }}" placeholder="{{ f.label }}" min="0" step="any"></sc-if>
    <sc-if value="{{ f.isTextarea }}"><textarea id="{{ f.inputId }}" name="{{ f.key }}" value="{{ f.value }}" onChange="{{ f.change }}" required="{{ f.required }}" disabled="{{ contentReadonly }}" aria-invalid="{{ f.hasError }}" aria-describedby="{{ f.inputId + '-error' }}" rows="4" placeholder="{{ f.label }}"></textarea></sc-if>
    <sc-if value="{{ f.isSelect }}"><select id="{{ f.inputId }}" name="{{ f.key }}" value="{{ f.value }}" onChange="{{ f.change }}" required="{{ f.required }}" disabled="{{ contentReadonly }}" aria-invalid="{{ f.hasError }}" aria-describedby="{{ f.inputId + '-error' }}"><option value="">{{ lblSelect }}</option><sc-for list="{{ f.options }}" as="option"><option value="{{ option.value }}">{{ option.label }}</option></sc-for></select></sc-if>
    <sc-if value="{{ f.isCheckbox }}"><input id="{{ f.inputId }}" name="{{ f.key }}" type="checkbox" checked="{{ f.checked }}" onChange="{{ f.change }}" disabled="{{ contentReadonly }}" aria-describedby="{{ f.inputId + '-error' }}"></sc-if>
    <sc-if value="{{ f.isFile }}"><div class="bo-upload"><sc-if value="{{ f.isImage && f.value }}"><div class="bo-upload-preview" style="background-image:url('{{ f.value }}')"></div></sc-if><input id="{{ f.inputId }}" name="{{ f.key }}" type="file" onChange="{{ f.upload }}" disabled="{{ contentReadonly }}" accept="{{ f.isImage ? 'image/png,image/jpeg,image/webp' : '.pdf,.png,.jpg,.jpeg,.webp,.txt' }}" aria-describedby="{{ f.inputId + '-error' }}"><sc-if value="{{ !f.isImage && f.value }}"><p>{{ f.value }}</p></sc-if></div></sc-if>
    <div id="{{ f.inputId + '-error' }}"><sc-if value="{{ f.hasError }}"><p class="field-error">{{ f.error }}</p></sc-if></div>
  </div></sc-for>
</x-dc></body></html>
