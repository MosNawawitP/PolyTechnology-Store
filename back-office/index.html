    let trackingRecords=this.state.records;
    try {
      const saved = JSON.parse(localStorage.getItem('plt_bo_content_v1') || 'null');
      if (saved && saved.version === 1) {
        const records = {...this.state.records};
        for (const [key,value] of Object.entries(saved.records || {})) if (key in records && !window.BO_DATA.readonly.includes(key) && Array.isArray(value)) records[key] = value;
        trackingRecords=window.BO_WORKFLOW.reconcile(records,true);this.setState({records:trackingRecords});this.saveStorage(trackingRecords);
      }

    this.publishTracking(trackingRecords);
    try { const lang = localStorage.getItem('plt_bo_lang'); if (lang === 'th' || lang === 'en') this.setState({lang}); } catch (_) {}

      const upgrade = sessionStorage.getItem('plt_bo_shell_upgrade');
      sessionStorage.removeItem('plt_bo_shell_upgrade');
      if (upgrade === 'layout-shell-2') this.setState({route:'workspace',email:'staff@polytechnology.demo'});

  tx(pair) { return pair[this.state.lang === 'en' ? 1 : 0]; }
  setLanguage(lang) { this.setState({lang}); try { localStorage.setItem('plt_bo_lang',lang); } catch (_) {} }

    this.setState(s => ({[name]:value, errors:{...s.errors,[name]:''}, notice:''}));
  }
  navigate(route) {
    clearTimeout(this._request);

  }
  selectMenu(id) {
    if (this.state.route !== 'workspace' || !this.MENUS.some(m => m[0] === id)) return;

    this.openScreen(page.home);
  }
  toggleNavigation() {
    if (window.matchMedia('(max-width:900px)').matches) this.setState({mobileOpen:!this.state.mobileOpen});
    else this.setState({sidebarCollapsed:!this.state.sidebarCollapsed});
  }
  validate(withPassword) {
    const email = this.state.email.trim();
    const errors = {};
    if (!email) errors.email = 'emailRequired';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'emailInvalid';
    if (withPassword && !this.state.password) errors.password = 'passwordRequired';
    this.setState({errors,notice:''});
    const first = Object.keys(errors)[0];
    if (first) { document.getElementById('staff-' + first)?.focus(); return false; }
    return true;
  }
  submitLogin(e) {
    e.preventDefault();
    if (this.state.busy) return;
    if (Date.now() < this.state.lockedUntil) { this.setState({notice:'locked'}); return; }
    if (!this.validate(true)) return;
    const valid = this.state.email.trim().toLowerCase() === 'staff@polytechnology.demo' && this.state.password === (this._demoPassword || 'PolytechDemo!');
    this.setState({busy:true,notice:''});
    this._request = setTimeout(() => {
      if (valid) this.setState({route:'workspace',menu:'dashboard',screen:'01-dashboard/manager',actor:'demo',selected:'',sidebarCollapsed:false,mobileOpen:false,search:'',profileOpen:false,notificationsOpen:false,busy:false,password:'',showPassword:false,attempts:0,lockedUntil:0});
      else this.setState(s => ({busy:false,notice:s.attempts + 1 >= 5 ? 'locked' : 'invalid',attempts:s.attempts + 1 >= 5 ? 0 : s.attempts + 1,lockedUntil:s.attempts + 1 >= 5 ? Date.now() + 30000 : 0}));
    },600);
  }

  submitReset(e) {
    e.preventDefault();
    if (this._resetUsed || !this._resetEligible || !this._resetExpires || Date.now()>this._resetExpires) { this.setState({resetError:this.m('ลิงก์ไม่ถูกต้อง หมดอายุ หรือใช้แล้ว กรุณาขอลิงก์ใหม่','Link is invalid, expired or used. Request a new link.')});return; }

  screenDef(id=this.state.screen) { return window.BO_CATALOG.screens.find(p => p.id === id); }

    const base=window.BO_DATA.roles[this.state.actor] || window.BO_DATA.roles.demo;
    const override=this.state.records.roles.find(r=>r.role===this.state.actor)?.grants;
    if (!override) return base;
    return {...base,menus:Object.keys(override).filter(k=>override[k].read),write:Object.keys(override).filter(k=>override[k].read && override[k].write)};
  }
  actorId() { return ['warehouse','engineer'].includes(this.state.actor) ? 'ST-02' : ['accounting','credit'].includes(this.state.actor) ? 'ST-03' : 'ST-01'; }
  canRead(module) { const m=this.roleDef().menus; return module==='dashboard' || m === 'all' || m.includes(module); }
  canWrite(page=this.screenDef()) {
    if (!page || !this.canRead(page.module) || window.BO_DATA.readonly.includes(page.collection)) return false;

    if (page.collection==='jobs') return ['demo','engineer'].includes(actor);
    if (actor==='sales' && page.module==='services' && !['surveys','leads'].includes(page.collection)) return false;

    return true;
  }
  scopedRows(collection) {
    const rows=this.state.records[collection] || [];
    const scope=this.roleDef().scope;
    if (scope==='all') return rows;
    if (scope==='warehouse') return rows.filter(r => {const order=r.order?this.state.records.orders.find(o=>o.id===r.order):null;return order?order.warehouse==='LLK':!r.warehouse || r.warehouse==='LLK';});
    const actor=this.actorId();
    const customers=new Set(this.state.records.customers.filter(c=>c.owner===actor).map(c=>c.id));
    return rows.filter(r => {
      if (collection==='staff') return r.id===actor;
      if (collection==='jobs' && this.state.actor==='engineer') return r.owner===actor;
      if (['products','prices','stock','brands','services','carriers','taxonomy','media','replies','templates'].includes(collection)) return true;
      if (collection==='customers') return customers.has(r.id);
      if (r.customer) return customers.has(r.customer);
      if (r.order) { const o=this.state.records.orders.find(o=>o.id===r.order); return !!o && customers.has(o.customer); }
      return !r.owner || r.owner===actor;
    });
  }
  entity(page=this.screenDef()) {
    const rows=this.scopedRows(page.collection);

    const form={};
    if (!page.create && row) for (const f of page.fields) {
      const value=row[f.key]; form[f.key]=Array.isArray(value) ? this.tx(value) : value ?? (f.type==='checkbox'?false:'');

    if (!page.create && page.collection==='roles' && row) {
      const role=window.BO_DATA.roles[row.role];

    }
