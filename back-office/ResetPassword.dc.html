<!DOCTYPE html><html><head><meta charset="utf-8"><script src="./support.js"></script></head><body><x-dc>
  <section class="auth-card" aria-labelledby="reset-title"><h1 id="reset-title">{{ resetTitle }}</h1><p class="intro">{{ resetIntro }}</p><form class="auth-form" onSubmit="{{ submitReset }}" noValidate="{{ true }}"><div class="field"><label for="new-password">{{ lblNewPassword }}</label><div class="password-control"><input id="new-password" name="newPassword" type="{{ newPasswordType }}" value="{{ newPassword }}" onChange="{{ onResetField }}" autoComplete="new-password"><button type="button" class="eye" onClick="{{ toggleNewPassword }}" aria-label="{{ t.show + ' ' + lblNewPassword }}">◉</button></div></div><div class="field"><label for="confirm-password">{{ lblConfirmPassword }}</label><div class="password-control"><input id="confirm-password" name="confirmPassword" type="{{ confirmPasswordType }}" value="{{ confirmPassword }}" onChange="{{ onResetField }}" autoComplete="new-password"><button type="button" class="eye" onClick="{{ toggleConfirmPassword }}" aria-label="{{ t.show + ' ' + lblConfirmPassword }}">◉</button></div></div><p class="helper">{{ lblPasswordHelp }}</p><sc-if value="{{ hasResetError }}"><p class="notice" role="alert">{{ resetError }}</p></sc-if><button class="primary" type="submit">{{ lblResetSave }}</button></form><p class="helper"><button class="text-link" type="button" onClick="{{ backToLogin }}">{{ t.back }}</button></p><p class="helper"><button class="text-link" type="button" onClick="{{ openForgot }}">{{ t.forgot }}</button></p></section>
</x-dc></body></html>
