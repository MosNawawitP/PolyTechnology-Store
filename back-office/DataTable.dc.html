<!DOCTYPE html><html><head><meta charset="utf-8"><script src="./support.js"></script></head><body><x-dc>
  <div class="bo-table-scroll"><table class="bo-data-table"><thead><tr><sc-if value="{{ hasTableImages }}"><th>{{ lblImage }}</th></sc-if><sc-for list="{{ tableHeaders }}" as="col"><th scope="col">{{ col.label }}</th></sc-for><th scope="col">{{ lblOpen }}</th></tr></thead><tbody><sc-for list="{{ tableRows }}" as="row"><tr><sc-if value="{{ hasTableImages }}"><td><div class="bo-table-image" style="background-image:url('{{ row.image }}')"></div></td></sc-if><sc-for list="{{ row.cells }}" as="cell"><td><sc-if value="{{ cell.badge }}"><span class="{{ cell.className }}">{{ cell.text }}</span></sc-if><sc-if value="{{ !cell.badge }}">{{ cell.text }}</sc-if></td></sc-for><td><button type="button" class="bo-text-action" onClick="{{ row.pick }}" aria-label="{{ lblOpen + ' ' + row.id }}">{{ lblOpen }} →</button></td></tr></sc-for></tbody></table></div>
  <sc-if value="{{ emptyRows }}"><div class="bo-empty"><p>{{ lblEmpty }}</p></div></sc-if>
  <div class="bo-pagination"><span>{{ pageLabel }}</span><div><button class="bo-secondary" type="button" onClick="{{ previousPage }}" disabled="{{ previousDisabled }}" aria-label="{{ lblPrevious }}">‹</button><span class="bo-page-number">{{ currentPage }}</span><button class="bo-secondary" type="button" onClick="{{ nextPage }}" disabled="{{ nextDisabled }}" aria-label="{{ lblNext }}">›</button></div></div>
</x-dc></body></html>
