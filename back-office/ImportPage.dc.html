<!DOCTYPE html><html><head><meta charset="utf-8"><script src="./support.js"></script></head><body><x-dc>
  <div class="bo-editor"><section class="bo-panel"><h2>{{ lblImportTitle }}</h2><p>{{ lblImportHelp }}</p><button class="bo-secondary" type="button" onClick="{{ downloadImportTemplate }}">{{ lblImportTemplate }}</button><div class="bo-form-field"><label for="bo-import-file">{{ lblImportFile }}</label><input id="bo-import-file" type="file" accept=".json,application/json" onChange="{{ readImportFile }}" disabled="{{ contentReadonly }}"></div></section><sc-if value="{{ hasImportPreview }}"><section class="bo-panel"><h2>{{ lblPreview }}</h2><sc-for list="{{ importPreview }}" as="row"><div class="bo-import-row"><strong>{{ row.title }}</strong><span>{{ row.error }}</span></div></sc-for></section></sc-if><button class="bo-primary" type="button" onClick="{{ applyImport }}" disabled="{{ importDisabled }}">{{ lblImportApply }}</button></div>
</x-dc></body></html>
