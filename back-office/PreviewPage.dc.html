<!DOCTYPE html><html><head><meta charset="utf-8"><script src="./support.js"></script></head><body><x-dc>
  <section class="bo-panel"><div class="bo-actions"><span>{{ previewText }}</span><select value="{{ previewTier }}" onChange="{{ onPreviewTier }}" aria-label="{{ lblPriceTier }}"><option>Retail</option><option>Partner</option><option>Grade A</option></select></div><div class="bo-store-preview"><div class="bo-preview-hero" style="background-image:linear-gradient(90deg,rgba(30,26,58,.86),rgba(30,26,58,.3)),url('{{ previewImage }}')"><strong>POLYTECHNOLOGY</strong><h2>{{ previewTitle }}</h2></div><div class="bo-media-grid"><sc-for list="{{ previewProducts }}" as="product"><article class="bo-media-card"><div class="bo-media-image" style="background-image:url('{{ product.image }}')"></div><strong>{{ product.label }}</strong><span>{{ product.price }}</span><small>{{ product.type }}</small></article></sc-for></div></div></section>
</x-dc></body></html>
