<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body>
<x-dc>
  <header class="bo-topbar">
    <button id="navigation-toggle" class="bo-icon-button" type="button" onClick="{{ toggleNavigation }}" aria-label="{{ t.toggleNavigation }}" aria-expanded="{{ navigationExpanded }}" aria-controls="bo-sidebar"><svg class="bo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"></path></svg></button>
    <div class="bo-search">
      <svg class="bo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"></circle><path d="m16 16 5 5"></path></svg>
      <input type="search" value="{{ search }}" onChange="{{ onSearch }}" placeholder="{{ t.search }}" aria-label="{{ t.searchMenus }}" aria-controls="bo-search-results" autoComplete="off">
      <sc-if value="{{ hasSearch }}"><div id="bo-search-results" class="bo-popover bo-search-results">
        <sc-for list="{{ searchResults }}" as="result"><button type="button" onClick="{{ result.pick }}">{{ result.label }}</button></sc-for>
        <sc-if value="{{ noSearchResults }}"><p role="status">{{ t.noResults }}</p></sc-if>
      </div></sc-if>
    </div>
    <div class="bo-topbar-actions">
      <nav class="language-switch" aria-label="{{ t.language }}"><button type="button" aria-pressed="{{ isThai }}" onClick="{{ setThai }}">TH</button><button type="button" aria-pressed="{{ isEnglish }}" onClick="{{ setEnglish }}">EN</button></nav>
      <div class="bo-notifications">
        <button class="bo-icon-button" type="button" onClick="{{ toggleNotifications }}" aria-label="{{ t.notifications }}" aria-expanded="{{ notificationsOpen }}" aria-controls="bo-notification-panel"><svg class="bo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 8 3 8 3 10H3c0-2 3-2 3-10m3 13a3 3 0 0 0 6 0"></path></svg></button>
        <sc-if value="{{ notificationsOpen }}"><section id="bo-notification-panel" class="bo-popover" aria-label="{{ t.notifications }}"><strong>{{ t.notifications }}</strong><p>{{ t.noNotifications }}</p></section></sc-if>
      </div>
      <div class="bo-profile">
        <button class="bo-profile-button" type="button" onClick="{{ toggleProfile }}" aria-label="{{ t.profile }}" aria-expanded="{{ profileOpen }}" aria-controls="bo-profile-panel"><span class="bo-avatar">{{ t.initials }}</span><span class="bo-staff"><strong>{{ t.staffName }}</strong><small>{{ t.staffRole }}</small></span><svg class="bo-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <sc-if value="{{ profileOpen }}"><div id="bo-profile-panel" class="bo-popover"><strong>{{ t.staffName }}</strong><p>{{ t.staffRole }}</p><label for="bo-persona">{{ lblPersona }}</label><select id="bo-persona" value="{{ personaValue }}" onChange="{{ changePersona }}"><sc-for list="{{ personaOptions }}" as="persona"><option value="{{ persona.value }}">{{ persona.label }}</option></sc-for></select><button type="button" onClick="{{ logout }}">{{ t.logout }}</button></div></sc-if>
      </div>
    </div>
  </header>
</x-dc>
</body></html>
