<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body>
<x-dc>
  <aside id="bo-sidebar" class="bo-sidebar" aria-label="{{ t.navigation }}">
    <div class="bo-brand"><img src="./assets/polytech-logo.png" width="44" height="44" alt="Polytechnology"><div class="bo-brand-copy"><strong>POLYTECHNOLOGY</strong><span>Back-office</span></div></div>
    <nav class="bo-navigation" aria-label="{{ t.navigation }}">
      <sc-for list="{{ menus }}" as="item">
        <button type="button" class="bo-menu" onClick="{{ item.pick }}" aria-current="{{ item.current }}" title="{{ item.label }}">
          <svg class="bo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.path }}"></path></svg>
          <span class="bo-menu-label">{{ item.label }}</span>
        </button>
      </sc-for>
    </nav>
    <div class="bo-sidebar-footer"><button type="button" class="bo-menu" onClick="{{ logout }}" title="{{ t.logout }}"><svg class="bo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H3v16h6m7-13 5 5-5 5M8 12h13"></path></svg><span class="bo-menu-label">{{ t.logout }}</span></button></div>
  </aside>
</x-dc>
</body></html>
