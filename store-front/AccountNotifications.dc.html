<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
          <section style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:22px">
            <h2 style="margin:0 0 4px;font-size:18px;font-weight:700">{{ lblNotifTitle }}</h2>
            <p style="margin:0 0 8px;font-size:13px;color:#6B6785">{{ lblNotifSub }}</p>
            <div style="display:grid">
              <sc-for list="{{ notifPrefs }}" as="np" hint-placeholder-count="4">
                <div style="display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid #ECEAF3">
                  <span id="{{ np.k }}" style="font-size:14.5px;line-height:1.5;color:#1E1A3A">{{ np.label }}</span>
                  <button type="button" role="switch" aria-checked="{{ np.aria }}" aria-labelledby="{{ np.k }}" onClick="{{ np.toggle }}" style="position:relative;flex:0 0 auto;width:48px;height:26px;padding:0;border:none;border-radius:13px;background:{{ np.bg }};box-shadow:inset 0 1px 3px rgba(30,26,58,.35);cursor:pointer">
                    <span style="position:absolute;top:3px;left:{{ np.left }};width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(30,26,58,.4);transition:left .15s"></span>
                  </button>
                </div>
              </sc-for>
            </div>
          </section>
</x-dc>
</body>
</html>
