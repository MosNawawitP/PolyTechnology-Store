<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div class="pt-container pt-about" style="padding:28px var(--pt-content-gutter) 52px">
        <section class="pt-about-hero" aria-label="{{ aboutHeroTitle }}">
          <div class="pt-about-hero-photo" aria-hidden="true"></div>
          <div class="pt-about-hero-copy">
            <h1>{{ aboutHeroTitle }}</h1>
            <p>{{ aboutHeroIntro }}</p>
          </div>
        </section>
        <section class="pt-about-story" aria-labelledby="pt-about-title">
          <figure class="pt-about-figure">
            <img src="./assets/about/engineering-team.webp" alt="{{ aboutImageAlt }}" width="1448" height="1086" decoding="async" />
          </figure>
          <div class="pt-about-copy">
            <h2 id="pt-about-title">{{ aboutTitle }}</h2>
            <sc-for list="{{ aboutBody }}" as="b" hint-placeholder-count="3">
              <p style="margin:0;font-size:15.5px;line-height:1.75;color:#36334F;max-width:76ch;text-wrap:pretty">{{ b.text }}</p>
            </sc-for>
            <blockquote style="margin:8px 0 0;background:#2E2575;border-radius:12px;padding:24px;color:#F1EFFB;font-size:17px;line-height:1.6;font-weight:600;text-wrap:pretty">{{ aboutPolicy }}</blockquote>
          </div>
        </section>
      </div>
</x-dc>
</body>
</html>
