<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="max-width:1240px;margin:0 auto;padding:28px 20px 52px">
        <h1 style="margin:0 0 8px;font-size:clamp(22px,3vw,30px);font-weight:700">{{ contactTitle }}</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#4A4766;max-width:72ch;text-wrap:pretty">{{ contactIntro }}</p>
        <dl style="margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1px;background:#E4E1EE;border:1px solid #E4E1EE;border-radius:12px;overflow:hidden">
          <sc-for list="{{ contactRows }}" as="c" hint-placeholder-count="4">
            <div style="background:#FFFFFF;padding:20px">
              <dt style="font-size:12.5px;color:#6B6785">{{ c.k }}</dt>
              <dd style="margin:6px 0 0;font-size:15px;font-weight:600;line-height:1.5;word-break:break-word">{{ c.v }}</dd>
            </div>
          </sc-for>
        </dl>
        <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:10px">
          <button type="button" onClick="{{ goServices }}" style="min-height:48px;padding:0 22px;background:#fff;border:1px solid #44359B;border-radius:9px;font-size:15px;font-weight:600;color:#44359B;cursor:pointer">{{ t.consultCta }}</button>
        </div>
      </div>
</x-dc>
</body>
</html>
