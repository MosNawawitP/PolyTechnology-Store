<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="max-width:1240px;margin:0 auto;padding:28px 20px 52px">
        <h1 style="margin:0 0 8px;font-size:clamp(22px,3vw,30px);font-weight:700">{{ promosTitle }}</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#4A4766;max-width:72ch;text-wrap:pretty">{{ promosIntro }}</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px">
          <sc-for list="{{ promos }}" as="p" hint-placeholder-count="3">
            <div style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:9px">
              <span style="align-self:flex-start;font:600 11px/1 'Sarabun',sans-serif;letter-spacing:.06em;color:#1E1A3A;background:#DDD6F7;border-radius:4px;padding:4px 8px">{{ p.tag }}</span>
              <h2 style="margin:0;font-size:18px;font-weight:700;line-height:1.35;text-wrap:pretty">{{ p.title }}</h2>
              <p style="margin:0;font-size:14px;color:#4A4766;line-height:1.6;text-wrap:pretty">{{ p.body }}</p>
              <div style="font:600 13px/1 'Sarabun',sans-serif;color:#5B49C4;margin-top:4px">{{ p.code }}</div>
              <button type="button" onClick="{{ p.use }}" style="align-self:flex-start;margin-top:auto;padding-top:0;min-height:44px;padding-inline:18px;background:#44359B;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">{{ p.cta }}</button>
            </div>
          </sc-for>
        </div>
      </div>
</x-dc>
</body>
</html>
