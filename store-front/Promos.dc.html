<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div class="pt-container" style="padding:28px var(--pt-content-gutter) 52px">
        <h1 style="margin:0 0 8px;font-size:clamp(22px,3vw,30px);font-weight:700">{{ promosTitle }}</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#4A4766;max-width:72ch;text-wrap:pretty">{{ promosIntro }}</p>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
          <sc-for list="{{ promos }}" as="p" hint-placeholder-count="6">
            <article style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0">
              <div style="position:relative;aspect-ratio:16/9;overflow:hidden;background:#ECE9F8">
                <img src="{{ p.photo }}" alt="{{ p.scope }}" width="1200" height="800" decoding="async" style="display:block;width:100%;height:100%;object-fit:cover" />
                <span style="position:absolute;left:16px;bottom:16px;background:#44359B;color:#FFFFFF;border-radius:8px;padding:10px 14px;font-size:clamp(16px,1.4vw,23px);font-weight:700;line-height:1.25;box-shadow:0 4px 12px #1E1A3A26">{{ p.benefit }}</span>
              </div>
              <div style="padding:22px;display:flex;flex-direction:column;gap:12px;flex:1">
              <span style="align-self:flex-start;font:600 11px/1 'Sarabun',sans-serif;letter-spacing:.06em;color:#1E1A3A;background:#DDD6F7;border-radius:4px;padding:4px 8px">{{ p.tag }}</span>
              <h2 style="margin:0;font-size:18px;font-weight:700;line-height:1.35;text-wrap:pretty">{{ p.title }}</h2>
              <div style="font-size:13px;font-weight:600;line-height:1.5;color:#5B49C4">{{ p.scope }}</div>
              <p style="margin:0;font-size:14px;color:#4A4766;line-height:1.6;text-wrap:pretty">{{ p.body }}</p>
              <p style="margin:0;font-size:12px;color:#6B6785;line-height:1.6;text-wrap:pretty">{{ p.terms }}</p>
              <div style="margin-top:auto;padding-top:14px;border-top:1px solid #E4E1EE;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
                <span style="font-size:12px;color:#6B6785">{{ p.period }}</span>
                <button type="button" onClick="{{ p.use }}" style="min-height:44px;padding:10px 16px;background:#44359B;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">{{ p.cta }}</button>
              </div>
              </div>
            </article>
          </sc-for>
        </div>
      </div>
</x-dc>
</body>
</html>
