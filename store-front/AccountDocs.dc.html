<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
          <div>
            <div style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:13px;margin-bottom:14px">
              <div>
                <label for="dfq" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblDocSearch }}</label>
                <input id="dfq" name="dfq" value="{{ dfq }}" onChange="{{ onForm }}" placeholder="INV-2026-" style="width:100%;height:42px;border:1px solid #D9D5E6;border-radius:8px;padding:0 10px;background:#F9F8FC;font:500 13px/1 'Sarabun',sans-serif" />
              </div>
              <div>
                <label for="dfk" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblDocType }}</label>
                <select id="dfk" name="dfk" value="{{ dfk }}" onChange="{{ onForm }}" style="width:100%;height:42px;border:1px solid #D9D5E6;border-radius:8px;padding:0 8px;background:#F9F8FC">
                  <sc-for list="{{ docKindOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
              </div>
            </div>
            <sc-if value="{{ noDocs }}">
              <div style="background:#FFFFFF;border:1px dashed #D9D5E6;border-radius:12px;padding:36px;text-align:center;font-size:14.5px;color:#6B6785">{{ noDocsMsg }}</div>
            </sc-if>
            <div style="display:grid;gap:1px;background:#E4E1EE;border:1px solid #E4E1EE;border-radius:12px;overflow:hidden">
              <sc-for list="{{ docRows }}" as="d" hint-placeholder-count="4">
                <div style="background:#FFFFFF;padding:15px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
                  <span style="flex:0 0 150px;font:600 13px/1.3 'Sarabun',sans-serif;color:#1E1A3A">{{ d.no }}</span>
                  <span style="flex:1 1 160px;font-size:14px;font-weight:600">{{ d.kind }}</span>
                  <span style="font-size:13px;color:#6B6785">{{ d.date }}</span>
                  <span style="font:600 14px/1 'Sarabun',sans-serif">{{ d.amount }}</span>
                  <span style="font-size:12.5px;font-weight:600;color:{{ d.payColor }}">{{ d.pay }}</span>
                  <button type="button" onClick="{{ d.dl }}" style="margin-left:auto;min-height:42px;padding:0 14px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">{{ lblDownload }}</button>
                </div>
              </sc-for>
            </div>
          </div>
</x-dc>
</body>
</html>
