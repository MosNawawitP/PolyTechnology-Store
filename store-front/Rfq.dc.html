<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div class="pt-container" style="padding:28px var(--pt-content-gutter) 52px">
        <sc-if value="{{ showRfqBackToCart }}">
          <button type="button" onClick="{{ rfqBackToCart }}" style="display:inline-flex;align-items:center;gap:7px;min-height:40px;margin:0 0 16px;padding:0 13px;background:#FFFFFF;border:1px solid #D9D5E6;border-radius:8px;font-size:13.5px;font-weight:600;color:#44359B;cursor:pointer">
            <span aria-hidden="true">←</span><span>{{ lblRfqBackToCart }}</span>
          </button>
        </sc-if>
        <h1 style="margin:0 0 8px;font-size:clamp(22px,3vw,30px);font-weight:700">{{ rfqTitle }}</h1>
        <p style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#4A4766;max-width:74ch;text-wrap:pretty">{{ rfqIntro }}</p>
        <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
          <div style="flex:1.7 1 420px;min-width:0;display:grid;gap:16px">
            <section style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:20px">
              <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px">
                <h2 style="margin:0;font-size:16px;font-weight:700">{{ rfqItemsTitle }}</h2>
                <sc-if value="{{ hasCartForRfq }}">
                  <button type="button" onClick="{{ rfqAddFromCart }}" style="min-height:40px;padding:0 14px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">{{ lblAddFromCart }}</button>
                </sc-if>
              </div>
              <sc-if value="{{ rfqEmpty }}">
                <div style="border:1px dashed #D9D5E6;border-radius:10px;padding:28px;text-align:center">
                  <p style="margin:0 0 14px;font-size:14px;color:#6B6785">{{ rfqEmptyMsg }}</p>
                  <button type="button" onClick="{{ goProducts }}" style="min-height:44px;padding:0 18px;background:#44359B;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">{{ t.heroCta1 }}</button>
                </div>
              </sc-if>
              <div style="display:grid;gap:10px">
                <sc-for list="{{ rfqRows }}" as="r" hint-placeholder-count="1">
                  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px;border:1px solid #ECEAF3;border-radius:10px;background:#F9F8FC">
                    <img src="{{ r.photo }}" alt="{{ r.img }}" onError="{{ r.hideImg }}" width="72" height="72" style="width:72px;height:72px;flex:0 0 72px;object-fit:contain;border:1px solid #E4E1EE;border-radius:8px;background:#FFFFFF" />
                    <div style="flex:1 1 200px;min-width:0">
                      <div style="margin-bottom:5px;font:500 10.5px/1.2 'Sarabun',sans-serif;color:#6B6785">{{ r.sku }}</div>
                      <div style="font-size:14px;font-weight:600;line-height:1.45">{{ r.name }}</div>
                    </div>
                    <span style="font-size:13px;color:#6B6785">{{ r.priceLabel }}</span>
                    <input aria-label="{{ lblQty }}" type="number" min="1" value="{{ r.q }}" onChange="{{ r.onQty }}" style="width:78px;height:44px;border:1px solid #D9D5E6;border-radius:8px;text-align:center;background:#fff;font:600 14px/1 'Sarabun',sans-serif" />
                    <button type="button" onClick="{{ r.remove }}" style="min-height:44px;padding:0 12px;background:none;border:none;color:#B23A2E;font-size:13px;font-weight:600;cursor:pointer">{{ lblRemove }}</button>
                  </div>
                </sc-for>
              </div>
            </section>

            <section style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:20px">
              <h2 style="margin:0 0 6px;font-size:16px;font-weight:700">{{ lblCompanyInfo }}</h2>
              <p style="margin:0 0 16px;font:500 13px/1.5 'Sarabun',sans-serif;color:#5B49C4">{{ rfqCompanyLine }}</p>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px">
                <div>
                  <label for="rfqNeed" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblNeedDate }}</label>
                  <input id="rfqNeed" type="date" value="{{ rfqNeed }}" onChange="{{ onRfqNeed }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" />
                </div>
                <div>
                  <label for="rfqMethod" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblReceiveMethod }}</label>
                  <select id="rfqMethod" value="{{ rfqMethod }}" onChange="{{ onRfqMethod }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC">
                    <sc-for list="{{ rfqMethodOptions }}" as="o" hint-placeholder-count="2"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                </div>
                <div style="grid-column:1 / -1">
                  <label for="rfqPlace" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblDeliverTo }}</label>
                  <textarea id="rfqPlace" name="line" rows="2" value="{{ rfqLine }}" onChange="{{ onRfqAddr }}" placeholder="{{ lblAddrLine }}" style="width:100%;border:1px solid #D9D5E6;border-radius:8px;padding:10px 11px;background:#F9F8FC;line-height:1.6;resize:vertical"></textarea>
                  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:10px">
                    <select name="prov" value="{{ rfqProv }}" onChange="{{ onRfqAddr }}" aria-label="{{ lblProvince }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                      <option value="">{{ lblProvince }}</option>
                      <sc-for list="{{ provOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                    </select>
                    <select name="dist" value="{{ rfqDist }}" onChange="{{ onRfqAddr }}" disabled="{{ rfqDistOff }}" aria-label="{{ rfqLblDist }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                      <option value="">{{ rfqLblDist }}</option>
                      <sc-for list="{{ rfqDistOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                    </select>
                    <select name="tam" value="{{ rfqTam }}" onChange="{{ onRfqAddr }}" disabled="{{ rfqTamOff }}" aria-label="{{ rfqLblTam }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                      <option value="">{{ rfqLblTam }}</option>
                      <sc-for list="{{ rfqTamOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                    </select>
                    <input value="{{ rfqZip }}" readOnly="{{ true }}" placeholder="{{ lblZip }}" aria-label="{{ lblZip }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A;font:500 14px/1 'Sarabun',sans-serif;color:#4A4766" />
                  </div>
                </div>
              </div>
              <div style="margin-top:15px">
                <label for="rfqNote" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblNotes }}</label>
                <textarea id="rfqNote" rows="4" value="{{ rfqNote }}" onChange="{{ onRfqNote }}" style="width:100%;border:1px solid #D9D5E6;border-radius:8px;padding:11px;background:#F9F8FC;line-height:1.6;resize:vertical"></textarea>
              </div>
              <sc-if value="{{ rfqError }}">
                <div role="alert" style="margin-top:14px;background:#FBEAE7;border:1px solid #E4B5AD;border-radius:9px;padding:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
                  <span style="flex:1 1 200px;font-size:13.5px;color:#7A2B21">{{ t.apiError }}</span>
                  <button type="button" onClick="{{ retryApi }}" style="min-height:40px;padding:0 14px;background:#44359B;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">{{ t.retry }}</button>
                </div>
              </sc-if>
              <button type="button" onClick="{{ submitRfq }}" style="margin-top:18px;min-height:50px;padding:0 24px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:15.5px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ lblSubmitRfq }}</button>
            </section>
          </div>

          <aside style="flex:1 1 250px;min-width:0;background:#2E2575;border-radius:12px;padding:22px;color:#C9C3EA">
            <h2 style="margin:0 0 14px;font-size:15px;font-weight:700;color:#F1EFFB">{{ lblRfqFlow }}</h2>
            <ol style="margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:q">
              <sc-for list="{{ rfqStatusFlow }}" as="q" hint-placeholder-count="6">
                <li style="display:flex;gap:11px;align-items:center;font-size:14px">
                  <span style="flex:none;width:8px;height:8px;border-radius:50%;background:#44359B"></span>
                  <span>{{ q.text }}</span>
                </li>
              </sc-for>
            </ol>
            <p style="margin:18px 0 0;font:500 11.5px/1.6 'Sarabun',sans-serif;color:#9088C4;text-wrap:pretty">{{ t.prototypeNote }}</p>
          </aside>
        </div>
      </div>
</x-dc>
</body>
</html>
