<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
  <div style="position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px;max-width:calc(100vw - 32px)">
    <sc-if value="{{ chatOpen }}" hint-placeholder-val="{{ false }}">
      <section role="dialog" aria-label="{{ lblChatTitle }}" style="width:380px;max-width:100%;height:min(540px,calc(100vh - 120px));background:#FFFFFF;border:1px solid #D9D5E6;border-radius:16px;box-shadow:0 12px 40px rgba(30,26,58,.28);display:flex;flex-direction:column;overflow:hidden">
        <div style="background:#44359B;color:#FFFFFF;padding:14px 16px;display:flex;gap:12px;align-items:center">
          <span aria-hidden="true" style="position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:#FFFFFF;color:#44359B;display:grid;place-items:center;font:700 14px/1 'Sarabun',sans-serif">PT<span style="position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#2BB673;border:2px solid #44359B"></span></span>
          <div style="flex:1 1 0;min-width:0"><div style="font-size:15px;font-weight:700;line-height:1.3">{{ lblChatTitle }}</div><div style="font-size:12.5px;color:#D8D3F0;margin-top:2px">{{ lblChatSub }}</div></div>
          <button type="button" onClick="{{ chatToggle }}" aria-label="{{ lblChatClose }}" style="flex:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);border:none;color:#FFFFFF;cursor:pointer;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div id="chatBody" style="flex:1 1 0;min-height:0;overflow-y:auto;background:#F4F3F8;padding:14px;display:flex;flex-direction:column;gap:10px">
          <div style="align-self:center;font-size:11.5px;color:#8A86A3;text-align:center">{{ lblChatNote }}</div>
          <sc-for list="{{ chatMsgs }}" as="cm" hint-placeholder-count="1">
            <div style="display:flex;justify-content:{{ cm.just }}">
              <div style="max-width:82%;background:{{ cm.bg }};color:{{ cm.fg }};border:1px solid {{ cm.bd }};border-radius:14px;padding:9px 12px">
                <div style="font-size:14px;line-height:1.55;text-wrap:pretty">{{ cm.text }}</div>
                <div style="font-size:11px;color:{{ cm.tc }};margin-top:3px;text-align:right">{{ cm.time }}</div>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{ chatTyping }}" hint-placeholder-val="{{ false }}"><div style="font-size:12.5px;color:#6B6785">{{ lblChatTyping }}</div></sc-if>
        </div>
        <div style="background:#FFFFFF;border-top:1px solid #ECEAF3;padding:10px 12px 12px;display:grid;gap:10px">
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ chatQuick }}" as="cq" hint-placeholder-count="3"><button type="button" onClick="{{ cq.pick }}" style="min-height:32px;padding:0 12px;border:1px solid #B3ACDD;background:#FFFFFF;color:#44359B;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer">{{ cq.label }}</button></sc-for>
          </div>
          <form onSubmit="{{ chatSubmit }}" style="display:flex;gap:8px">
            <input type="text" name="chat" value="{{ chatInput }}" onChange="{{ chatType }}" placeholder="{{ lblChatPh }}" autoComplete="off" aria-label="{{ lblChatPh }}" style="flex:1 1 0;min-width:0;height:44px;border:1px solid #D9D5E6;border-radius:22px;padding:0 16px;font-size:14px;background:#FFFFFF" />
            <button type="submit" style="flex:none;min-height:44px;padding:0 18px;background:#44359B;color:#FFFFFF;border:none;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer">{{ lblChatSend }}</button>
          </form>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{ chatClosed }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ chatToggle }}" aria-label="{{ lblChatOpen }}" style="width:60px;height:60px;border-radius:50%;background:#44359B;border:2px solid #FFFFFF;color:#FFFFFF;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 20px rgba(68,53,155,.45)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path><path d="M8.5 11h7M8.5 14h4"></path></svg></button>
    </sc-if>
  </div>
</x-dc>
</body>
</html>
