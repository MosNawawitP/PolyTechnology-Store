<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div role="dialog" aria-modal="true" aria-label="{{ dTitle }}" onClick="{{ closeAddr }}" style="position:fixed;inset:0;z-index:85;background:rgba(30,26,58,.5);display:flex;align-items:center;justify-content:center;padding:20px">
        <div onClick="{{ stopProp }}" style="background:#FFFFFF;border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 20px 50px rgba(30,26,58,.35)">
          <div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
            <h2 style="margin:0;font-size:20px;font-weight:700;color:#1E1A3A">{{ dTitle }}</h2>
            <button type="button" onClick="{{ closeAddr }}" aria-label="{{ t.close }}" style="flex:0 0 auto;width:36px;height:36px;background:#F1EFF7;border:none;border-radius:8px;font-size:16px;color:#36334F;cursor:pointer">✕</button>
          </div>
          <div style="display:grid;gap:14px">
            <div><label for="adLabel" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblAddrName }}</label><input id="adLabel" name="label" value="{{ dLabel }}" onChange="{{ onDraft }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px">
              <div><label for="adName" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblRecipient }}</label><input id="adName" name="name" value="{{ dName }}" onChange="{{ onDraft }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="adPhone" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPhone2 }}</label><input id="adPhone" name="phone" value="{{ dPhone }}" onChange="{{ onDraft }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
            </div>
            <div>
              <label for="adLine" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblAddrLine }}</label>
              <textarea id="adLine" name="line" rows="2" value="{{ dLine }}" onChange="{{ onDraft }}" style="width:100%;border:1px solid #D9D5E6;border-radius:8px;padding:10px 11px;background:#F9F8FC;line-height:1.6;resize:vertical"></textarea>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:10px">
                <select name="prov" value="{{ dProv }}" onChange="{{ onDraft }}" aria-label="{{ lblProvince }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                  <option value="">{{ lblProvince }}</option>
                  <sc-for list="{{ provOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
                <select name="dist" value="{{ dDist }}" onChange="{{ onDraft }}" disabled="{{ dDistOff }}" aria-label="{{ dLblDist }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                  <option value="">{{ dLblDist }}</option>
                  <sc-for list="{{ dDistOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
                <select name="tam" value="{{ dTam }}" onChange="{{ onDraft }}" disabled="{{ dTamOff }}" aria-label="{{ dLblTam }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                  <option value="">{{ dLblTam }}</option>
                  <sc-for list="{{ dTamOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
                <input value="{{ dZip }}" readOnly="{{ true }}" placeholder="{{ lblZip }}" aria-label="{{ lblZip }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A;color:#4A4766" />
              </div>
            </div>
            <div>
              <div style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPickOnMap }}</div>
              <div ref="{{ mapRef }}" style="isolation:isolate;height:240px;border:1px solid #D9D5E6;border-radius:10px;background:#EEEBF6;overflow:hidden"></div>
              <div style="display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;margin-top:6px;font-size:12.5px;color:#6B6785"><span>{{ lblMapHint }}</span><span style="font-weight:600;color:#4A4766">{{ dCoord }}</span></div>
            </div>
            <label style="display:flex;gap:11px;align-items:center;cursor:pointer;padding:12px 14px;border:1px solid #E4E1EE;border-radius:10px;background:#F9F8FC">
              <input type="checkbox" name="tax" checked="{{ dTax }}" onChange="{{ onDraft }}" style="width:20px;height:20px;accent-color:#44359B;flex:none" />
              <span style="font-size:14px;color:#1E1A3A">{{ lblIsTaxAddr }}</span>
            </label>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:22px;justify-content:flex-end">
            <button type="button" onClick="{{ closeAddr }}" style="min-height:46px;padding:0 20px;background:#FFFFFF;border:1px solid #D9D5E6;border-radius:9px;font-size:14px;font-weight:600;color:#1E1A3A;cursor:pointer">{{ t.cancel }}</button>
            <button type="button" onClick="{{ saveAddr }}" style="min-height:46px;padding:0 22px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:14px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ t.save }}</button>
          </div>
        </div>
      </div>
</x-dc>
</body>
</html>
