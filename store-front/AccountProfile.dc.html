<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
          <section style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:22px">
            <h2 style="margin:0 0 4px;font-size:18px;font-weight:700">{{ lblProfileTitle }}</h2>
            <p style="margin:0;font-size:13px;color:#6B6785">{{ lblProfileSub }}</p>
            <sc-if value="{{ isCompanyAcct }}">
              <h3 style="margin:22px 0 12px;font-size:14px;font-weight:700;color:#4A4766">{{ lblSecCompany }}</h3>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:15px"><div><label for="pfCompany" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblCompanyName }}</label><input id="pfCompany" name="company" value="{{ profile.company }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfTax" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblTaxId }}</label><input id="pfTax" name="taxId" value="{{ profile.taxId }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfBranch" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblBranch }}</label><input id="pfBranch" name="branch" value="{{ profile.branch }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div></div>
              <h3 style="margin:22px 0 12px;font-size:14px;font-weight:700;color:#4A4766">{{ lblSecContact }}</h3>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:15px"><div><label for="pfName" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblContact }}</label><input id="pfName" name="fullName" value="{{ profile.name }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfPhone" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPhone2 }}</label><input id="pfPhone" name="phone" type="tel" value="{{ profile.phone }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfEmail" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblEmailField }}</label><input id="pfEmail" name="email" type="email" value="{{ profile.email }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div></div>
            </sc-if>
            <sc-if value="{{ isPersonAcct }}">
              <h3 style="margin:22px 0 12px;font-size:14px;font-weight:700;color:#4A4766">{{ lblSecPerson }}</h3>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:15px"><div><label for="pfName" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblFullName }}</label><input id="pfName" name="fullName" value="{{ profile.name }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfPhone" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPhone2 }}</label><input id="pfPhone" name="phone" type="tel" value="{{ profile.phone }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfEmail" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblEmailField }}</label><input id="pfEmail" name="email" type="email" value="{{ profile.email }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div><div><label for="pfTax" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblTaxIdPerson }}</label><input id="pfTax" name="taxId" value="{{ profile.taxId }}" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div></div>
            </sc-if>
            <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:24px">
              <button type="button" onClick="{{ saveProfile }}" style="min-height:48px;padding:0 20px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:14.5px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ lblSaveProfile }}</button>
              <button type="button" onClick="{{ changePw }}" style="min-height:48px;padding:0 20px;background:#fff;border:1px solid #D9D5E6;border-radius:9px;font-size:14.5px;font-weight:600;color:#1E1A3A;cursor:pointer">{{ lblChangePw }}</button>
            </div>
          </section>
</x-dc>
</body>
</html>
