<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
  <sc-if value="{{ toast }}">
    <div role="status" aria-live="polite" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#1E1A3A;color:#F1EFFB;border-radius:10px;padding:13px 18px;box-shadow:0 10px 30px rgba(30,26,58,.3);font-size:14px;display:flex;gap:14px;align-items:center;max-width:min(92vw,560px);animation:fadeup .18s ease-out">
      <span style="width:8px;height:8px;border-radius:50%;background:{{ toastColor }};flex:none"></span>
      <span style="line-height:1.45">{{ toast }}</span>
      <button type="button" onClick="{{ closeToast }}" aria-label="{{ t.close }}" style="background:none;border:none;color:#B0A9D8;font-size:16px;cursor:pointer;margin-left:auto">✕</button>
    </div>
  </sc-if>
</x-dc>
</body>
</html>
