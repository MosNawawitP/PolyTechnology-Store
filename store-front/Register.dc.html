<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div class="pt-container" style="padding:32px var(--pt-content-gutter) 52px">
        <sc-if value="{{ showRegTabs }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">
            <button type="button" onClick="{{ goRegisterPerson }}" style="min-height:44px;padding:0 16px;background:{{ regTabPersonBg }};border:1px solid {{ regTabPersonBd }};border-radius:8px;font-size:14px;font-weight:600;color:{{ regTabPersonFg }};cursor:pointer">{{ lblRegPerson }}</button>
            <button type="button" onClick="{{ goRegisterCompany }}" style="min-height:44px;padding:0 16px;background:{{ regTabCompanyBg }};border:1px solid {{ regTabCompanyBd }};border-radius:8px;font-size:14px;font-weight:600;color:{{ regTabCompanyFg }};cursor:pointer">{{ lblRegCompany }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ isRegPerson }}">
          <form onSubmit="{{ registerPerson }}" style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:24px">
            <h1 style="margin:0 0 18px;font-size:22px;font-weight:700">{{ lblRegPerson }}</h1>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px">
              <div><label for="rpName" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblFullName }}</label><input id="rpName" name="fullName" value="{{ f.fullName }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rpPhone" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPhone2 }}</label><input id="rpPhone" name="phone" type="tel" value="{{ f.phone }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rpEmail" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblEmailField }}</label><input id="rpEmail" name="email" type="email" value="{{ f.email }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rpPw" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPassword }}</label><input id="rpPw" type="password" autoComplete="new-password" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
            </div>
            <div style="margin-top:15px"><div>
                <label for="rpShip" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblShipAddr }}</label>
                <textarea id="rpShip" name="line" rows="2" value="{{ shipLine }}" onChange="{{ onShipAddr }}" placeholder="{{ lblAddrLine }}" style="width:100%;border:1px solid #D9D5E6;border-radius:8px;padding:10px 11px;background:#F9F8FC;line-height:1.6;resize:vertical"></textarea>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:10px">
                  <select name="prov" value="{{ shipProv }}" onChange="{{ onShipAddr }}" aria-label="{{ lblProvince }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ lblProvince }}</option>
                    <sc-for list="{{ provOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <select name="dist" value="{{ shipDist }}" onChange="{{ onShipAddr }}" disabled="{{ shipDistOff }}" aria-label="{{ shipLblDist }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ shipLblDist }}</option>
                    <sc-for list="{{ shipDistOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <select name="tam" value="{{ shipTam }}" onChange="{{ onShipAddr }}" disabled="{{ shipTamOff }}" aria-label="{{ shipLblTam }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ shipLblTam }}</option>
                    <sc-for list="{{ shipTamOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <input value="{{ shipZip }}" readOnly="{{ true }}" placeholder="{{ lblZip }}" aria-label="{{ lblZip }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A;font:500 14px/1 'Sarabun',sans-serif;color:#4A4766" />
                </div>
              </div></div>
            <button type="submit" style="margin-top:20px;min-height:50px;padding:0 24px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:15.5px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ lblCreateAccount }}</button>
          </form>
        </sc-if>

        <sc-if value="{{ isRegCompany }}">
          <form onSubmit="{{ registerCompany }}" style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:24px">
            <h1 style="margin:0 0 18px;font-size:22px;font-weight:700">{{ lblRegCompany }}</h1>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:15px">
              <div><label for="rcName" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblCompanyName }}</label><input id="rcName" name="company" value="{{ f.company }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rcTax" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblTaxId }}</label><input id="rcTax" name="taxId" value="{{ f.taxId }}" onChange="{{ onForm }}" required="true" inputmode="numeric" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC;font:500 14px/1 'Sarabun',sans-serif" /></div>
              <div><label for="rcContact" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblContact }}</label><input id="rcContact" name="contact" value="{{ f.contact }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rcPhone" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPhone2 }}</label><input id="rcPhone" name="phone" type="tel" value="{{ f.phone }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div><label for="rcEmail" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblEmailField }}</label><input id="rcEmail" name="email" type="email" value="{{ f.email }}" onChange="{{ onForm }}" required="true" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" /></div>
              <div>
                <label for="rcBiz" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblBizType }}</label>
                <select id="rcBiz" name="bizType" onChange="{{ onForm }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC">
                  <sc-for list="{{ bizOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
              </div>
              <div><label for="rcSap" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblSapCode }}</label><input id="rcSap" name="sapCode" onChange="{{ onForm }}" placeholder="C-10000" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC;font:500 14px/1 'Sarabun',sans-serif" /></div>
            </div>
            <div style="margin-top:15px"><div>
                <label for="rcAddr" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblCompanyAddr }}</label>
                <textarea id="rcAddr" name="line" rows="2" value="{{ shipLine }}" onChange="{{ onShipAddr }}" placeholder="{{ lblAddrLine }}" style="width:100%;border:1px solid #D9D5E6;border-radius:8px;padding:10px 11px;background:#F9F8FC;line-height:1.6;resize:vertical"></textarea>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:10px">
                  <select name="prov" value="{{ shipProv }}" onChange="{{ onShipAddr }}" aria-label="{{ lblProvince }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ lblProvince }}</option>
                    <sc-for list="{{ provOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <select name="dist" value="{{ shipDist }}" onChange="{{ onShipAddr }}" disabled="{{ shipDistOff }}" aria-label="{{ shipLblDist }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ shipLblDist }}</option>
                    <sc-for list="{{ shipDistOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <select name="tam" value="{{ shipTam }}" onChange="{{ onShipAddr }}" disabled="{{ shipTamOff }}" aria-label="{{ shipLblTam }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A">
                    <option value="">{{ shipLblTam }}</option>
                    <sc-for list="{{ shipTamOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                  <input value="{{ shipZip }}" readOnly="{{ true }}" placeholder="{{ lblZip }}" aria-label="{{ lblZip }}" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 9px;background:#F9F8FC;font-size:14px;color:#1E1A3A;font:500 14px/1 'Sarabun',sans-serif;color:#4A4766" />
                </div>
              </div></div>
            <button type="submit" style="margin-top:20px;min-height:50px;padding:0 24px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:15.5px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ lblCreateAccount }}</button>
          </form>
        </sc-if>

        <sc-if value="{{ isRegDonePerson }}">
          <div style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:26px">
            <h1 style="margin:0 0 10px;font-size:22px;font-weight:700">{{ lblRegDonePersonTitle }}</h1>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.65;color:#4A4766;max-width:68ch;text-wrap:pretty">{{ lblRegDonePersonBody }}</p>
            <button type="button" onClick="{{ goProducts }}" style="min-height:48px;padding:0 20px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:15px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ t.heroCta1 }}</button>
          </div>
        </sc-if>

        <sc-if value="{{ isRegDoneCompany }}">
          <div style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:26px">
            <span style="display:inline-block;font:600 11.5px/1 'Sarabun',sans-serif;color:#0A3D22;background:#CDEBD9;border-radius:5px;padding:6px 10px">{{ lblRegDoneCompanyTag }}</span>
            <h1 style="margin:14px 0 10px;font-size:22px;font-weight:700">{{ lblRegDoneCompanyTitle }}</h1>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.65;color:#4A4766;max-width:68ch;text-wrap:pretty">{{ lblRegDoneCompanyBody }}</p>
            <div style="display:flex;flex-wrap:wrap;gap:9px">
              <button type="button" onClick="{{ goProducts }}" style="min-height:48px;padding:0 20px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:15px;font-weight:700;color:#FFFFFF;cursor:pointer">{{ t.heroCta1 }}</button>
              <button type="button" onClick="{{ requestTerms }}" style="min-height:48px;padding:0 20px;background:#fff;border:1px solid #44359B;border-radius:9px;font-size:14.5px;font-weight:600;color:#44359B;cursor:pointer">{{ lblRequestTerms }}</button>
            </div>
            <div style="margin-top:22px;padding-top:16px;border-top:1px dashed #D9D5E6">
              <div style="font-size:12.5px;font-weight:600;color:#8A86A3;margin-bottom:9px">{{ lblApproveAs }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:9px">
                <button type="button" onClick="{{ approvePartner }}" style="min-height:42px;padding:0 16px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:13.5px;font-weight:600;color:#1E1A3A;cursor:pointer">{{ chipPartner }}</button>
                <button type="button" onClick="{{ approveGradeA }}" style="min-height:42px;padding:0 16px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:13.5px;font-weight:600;color:#1E1A3A;cursor:pointer">{{ chipGradeA }}</button>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
</x-dc>
</body>
</html>
