<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="pt-home-surface">
<div class="pt-home">
  <section class="pt-hero" aria-label="{{ lblHomeHighlights }}" aria-roledescription="carousel" onMouseEnter="{{ hero.hover }}" onMouseLeave="{{ hero.leave }}" onFocus="{{ hero.focus }}" onBlur="{{ hero.blur }}">
    <img class="{{ hero.photoClass }}" src="{{ hero.photo }}" srcSet="{{ hero.srcset }}" data-fallback-src="{{ hero.fallback }}" onError="{{ hero.onError }}" sizes="(min-width:1680px) 1584px, (min-width:1240px) 95vw, 1192px" width="2172" height="724" alt="" fetchPriority="high" />
    <div class="pt-hero-body">
      <span class="pt-eyebrow">{{ hero.kicker }}</span>
      <h1>{{ hero.title }}</h1>
      <p>{{ hero.sub }}</p>
      <div class="pt-hero-actions">
        <button type="button" class="pt-button pt-button--solid" onClick="{{ hero.go }}">{{ hero.cta }}</button>
        <sc-if value="{{ showServices }}"><button type="button" class="pt-button pt-button--outline" onClick="{{ homeConsult }}">{{ lblHomeConsult }}</button></sc-if>
      </div>
    </div>
  </section>

  <nav class="pt-shortcuts" aria-label="{{ lblHomeHighlights }}">
    <sc-for list="{{ homeShortcuts }}" as="item" hint-placeholder-count="4">
      <button type="button" class="pt-shortcut" onClick="{{ item.go }}">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.icon }}"></path></svg>
        <span><strong>{{ item.title }}</strong><small>{{ item.sub }}</small></span>
      </button>
    </sc-for>
  </nav>

  <section class="pt-section" data-screen-label="Business categories">
    <div class="pt-section-heading"><h2>{{ lblHomeBusiness }}</h2></div>
    <nav class="pt-business-grid" aria-label="{{ lblHomeBusiness }}">
      <sc-for list="{{ catCards }}" as="c" hint-placeholder-count="6">
        <button type="button" class="pt-business-card" onClick="{{ c.go }}">
          <img src="{{ c.photo }}" srcSet="{{ c.srcset }}" sizes="(min-width:1680px) 520px, (min-width:1240px) 32vw, 400px" width="1672" height="941" loading="lazy" alt="" />
          <span class="pt-business-copy"><span><strong>{{ c.name }}</strong><small>{{ c.note }}</small></span><span class="pt-card-arrow" aria-hidden="true">›</span></span>
        </button>
      </sc-for>
    </nav>
  </section>

  <section class="pt-section" data-screen-label="Recommended products">
    <div class="pt-section-heading"><h2>{{ lblBest }}</h2><button type="button" class="pt-text-link" onClick="{{ homeShop }}">{{ lblSeeAll }} →</button></div>
    <div class="pt-product-grid">
      <sc-for list="{{ featuredHome }}" as="p" hint-placeholder-count="4">
        <article class="pt-product-card">
          <button type="button" class="pt-product-photo" onClick="{{ p.open }}" aria-label="{{ p.name }}"><img src="{{ p.photo }}" alt="{{ p.name }}" width="480" height="480" loading="lazy" onError="{{ hideImg }}" /></button>
          <div class="pt-product-info">
            <span class="pt-product-brand">{{ p.brand }}</span>
            <button type="button" class="pt-product-name" onClick="{{ p.open }}">{{ p.name }}</button>
            <div class="pt-product-bottom"><span class="pt-product-price">{{ p.priceLabel }}</span><span class="pt-product-stock" style="color:{{ p.stockColor }}">{{ p.stockLabel }}</span></div>
            <button type="button" class="pt-button pt-button--solid pt-product-cta" onClick="{{ p.primary }}">{{ p.primaryLabel }}</button>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

        <sc-if value="{{ showCategoryRows }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ homeRows }}" as="row" hint-placeholder-count="3">
          <section style="display:flex;flex-direction:column;gap:14px;margin-top:8px">
            <div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center">
              <h2 style="margin:0;font-size:22px;font-weight:700;color:#1E1A3A">{{ row.title }}</h2>
              <div style="display:flex;flex-wrap:wrap;gap:8px;flex:1">
                <sc-for list="{{ row.pills }}" as="pl" hint-placeholder-count="4">
                  <button type="button" onClick="{{ pl.pick }}" aria-pressed="{{ pl.on }}" style="height:32px;padding:0 14px;border-radius:16px;border:none;background:{{ pl.bg }};color:{{ pl.fg }};font-size:13px;font-weight:600;cursor:pointer">{{ pl.label }}</button>
                </sc-for>
              </div>
              <button type="button" onClick="{{ row.all }}" style="background:none;border:none;color:#44359B;font-size:14px;font-weight:600;cursor:pointer;padding:0">{{ lblSeeAll }} →</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px">
              <button type="button" onClick="{{ row.all }}" style="position:relative;overflow:hidden;border:none;border-radius:14px;min-height:300px;padding:0;cursor:pointer;background:#2E2575;color:#FFFFFF;text-align:left">
                <img src="{{ row.tilePhoto }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" />
                <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,37,117,.55) 0%,rgba(46,37,117,.92) 100%)"></span>
                <span style="position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:6px">
                  <span style="font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance">{{ row.tileTitle }}</span>
                  <span style="font-size:13px;color:#E4DFFF;line-height:1.4">{{ row.tileSub }}</span>
                </span>
              </button>
              <sc-for list="{{ row.items }}" as="p" hint-placeholder-count="5">
                <button type="button" onClick="{{ p.open }}" style="text-align:left;background:#FFFFFF;border:1px solid #ECE9F4;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:300px" style-hover="box-shadow:0 8px 22px rgba(68,53,155,.14)">
                  <span style="aspect-ratio:1/1;width:100%;background:#ECE9F8;border-radius:10px;position:relative;overflow:hidden;display:block"><img src="{{ p.photo }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" /></span>
                  <span style="font:600 10.5px/1.2 'Sarabun',sans-serif;letter-spacing:.06em;color:#6B6785;text-transform:uppercase;margin-top:6px">{{ p.brand }}</span>
                  <span style="font-size:14px;font-weight:500;line-height:1.4;color:#1E1A3A;text-wrap:pretty">{{ p.name }}</span>
                  <span style="margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:2px">
                    <span style="font:700 16px/1.3 'Sarabun',sans-serif;color:#44359B">{{ p.priceLabel }}</span>
                    <span style="font-size:12px;font-weight:600;color:{{ p.stockColor }}">{{ p.stockLabel }}</span>
                  </span>
                </button>
              </sc-for>
            </div>
          </section>
        </sc-for>
        </sc-if>

  <sc-if value="{{ showServices }}">
  <section class="pt-services pt-section" data-screen-label="Engineering services">
    <div class="pt-section-heading"><div><h2>{{ lblHomeServices }}</h2><p>{{ lblHomeServiceIntro }}</p></div><button type="button" class="pt-button pt-button--solid" onClick="{{ homeConsult }}">{{ lblHomeEngineers }} →</button></div>
    <div class="pt-service-grid">
      <sc-for list="{{ serviceCards }}" as="sv" hint-placeholder-count="5">
        <button type="button" class="pt-service-card" onClick="{{ sv.go }}" title="{{ sv.short }}">
          <img src="{{ sv.photo }}" srcSet="{{ sv.srcset }}" sizes="(min-width:1680px) 300px, (min-width:1240px) 19vw, 240px" width="1672" height="941" loading="lazy" alt="" />
          <span class="pt-service-copy"><small>{{ sv.code }}</small><strong>{{ sv.name }}</strong></span>
        </button>
      </sc-for>
    </div>
  </section>
  </sc-if>

  <section class="pt-section pt-coupons" data-screen-label="Coupons">
    <div class="pt-section-heading"><div><h2>{{ lblCoupons }}</h2><p>{{ lblCouponSub }}</p></div><button type="button" class="pt-text-link" onClick="{{ goCouponPage }}">{{ lblViewCoupons }} →</button></div>
    <div class="pt-coupon-grid">
      <sc-for list="{{ couponCards }}" as="cp" hint-placeholder-count="5">
        <article class="pt-coupon" style="opacity:{{ cp.dim }}">
          <span class="pt-coupon-value">{{ cp.value }}</span>
          <div class="pt-coupon-body"><strong>{{ cp.title }}</strong><small>{{ cp.cond }}</small><button type="button" class="pt-button pt-coupon-cta" disabled="{{ cp.off }}" onClick="{{ cp.collect }}" style="background:{{ cp.bg }};color:{{ cp.fg }};cursor:{{ cp.cursor }}">{{ cp.label }}</button></div>
        </article>
      </sc-for>
    </div>
  </section>
</div>
</div>
</x-dc>
</body>
</html>
