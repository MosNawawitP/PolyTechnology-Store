<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="max-width:1240px;margin:0 auto;padding:20px 20px 56px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:stretch">
          <section aria-label="highlights" style="position:relative;flex:1 1 100%;min-width:0;min-height:460px;border-radius:18px;overflow:hidden;background:#2E2575;color:#FFFFFF">
            <img src="{{ hero.photo }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" />
            <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(46,37,117,.97) 0%,rgba(68,53,155,.84) 50%,rgba(68,53,155,.5) 100%)"></div>
            <div style="position:relative;padding:clamp(24px,4vw,46px);display:flex;flex-direction:column;gap:14px;min-height:460px;max-width:620px">
              <span style="font:600 15px/1 'Sarabun',sans-serif;color:#E4DFFF;letter-spacing:.01em">polytechnology</span>
              <span style="font:700 12.5px/1.2 'Sarabun',sans-serif;letter-spacing:.12em;color:#FFFFFF;margin-top:18px">{{ hero.kicker }}</span>
              <h1 style="margin:0;font-size:clamp(28px,3.6vw,42px);line-height:1.2;font-weight:700;text-wrap:pretty">{{ hero.title }}</h1>
              <p style="margin:0;font-size:16px;line-height:1.6;color:#E4DFFF;max-width:46ch;text-wrap:pretty">{{ hero.sub }}</p>
              <button type="button" onClick="{{ hero.go }}" style="align-self:flex-start;margin-top:10px;height:48px;padding:0 28px;background:#FFFFFF;color:#2E2575;border:none;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer" style-hover="background:#ECE9F8">{{ hero.cta }}</button>
            </div>
            <div style="position:absolute;right:18px;bottom:16px;display:flex;gap:8px;align-items:center">
              <span style="font:600 13px/1 'Sarabun',sans-serif;color:#FFFFFF;margin-right:4px">{{ hero.idx }}</span>
              <button type="button" onClick="{{ hero.prev }}" aria-label="previous" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#FFFFFF;font-size:18px;cursor:pointer">‹</button>
              <button type="button" onClick="{{ hero.next }}" aria-label="next" style="width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#FFFFFF;font-size:18px;cursor:pointer">›</button>
            </div>
          </section>

        </div>

        <section data-screen-label="Coupons" style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
          <div style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between">
            <div style="display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline"><h2 style="margin:0;font-size:20px;font-weight:700;color:#1E1A3A">{{ lblCoupons }}</h2><span style="font-size:13px;color:#4A4766">{{ lblCouponSub }}</span></div>
            <button type="button" onClick="{{ goCouponPage }}" style="background:none;border:none;color:#44359B;font-size:14px;font-weight:600;cursor:pointer;padding:0">{{ lblViewCoupons }} →</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">
            <sc-for list="{{ couponCards }}" as="cp" hint-placeholder-count="5">
              <div style="display:flex;min-width:0;background:#FFFFFF;border:1px solid #ECE9F4;border-radius:12px;overflow:hidden;opacity:{{ cp.dim }}">
                <div style="flex:none;width:68px;background:#44359B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:8px 4px;font:700 18px/1.1 'Sarabun',sans-serif;text-align:center;border-right:2px dashed #C9C1EC">{{ cp.value }}</div>
                <div style="flex:1;min-width:0;padding:10px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:8px">
                  <div><div style="font-size:13px;font-weight:700;color:#1E1A3A;line-height:1.3">{{ cp.title }}</div><div style="font-size:11.5px;color:#4A4766;margin-top:2px;line-height:1.35">{{ cp.cond }}</div></div>
                  <button type="button" disabled="{{ cp.off }}" onClick="{{ cp.collect }}" style="align-self:flex-start;min-height:30px;padding:0 12px;border:none;border-radius:15px;font-size:12px;font-weight:600;background:{{ cp.bg }};color:{{ cp.fg }};cursor:{{ cp.cursor }}">{{ cp.label }}</button>
                </div>
              </div>
            </sc-for>
          </div>
        </section>

        <section style="display:flex;flex-direction:column;gap:14px;margin-top:8px">
          <div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between">
            <h2 style="margin:0;font-size:22px;font-weight:700;color:#1E1A3A">{{ lblBest }}</h2>
            <button type="button" onClick="{{ goProducts }}" style="background:none;border:none;color:#44359B;font-size:14px;font-weight:600;cursor:pointer;padding:0">{{ lblSeeAll }} →</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px">
            <sc-for list="{{ featuredHome }}" as="p" hint-placeholder-count="10">
              <button type="button" onClick="{{ p.open }}" style="text-align:left;background:#FFFFFF;border:1px solid #ECE9F4;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:320px" style-hover="box-shadow:0 8px 22px rgba(68,53,155,.14)">
                <span style="aspect-ratio:1/1;width:100%;background:#ECE9F8;border-radius:10px;position:relative;overflow:hidden;display:block"><img src="{{ p.photo }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" /></span>
                <span style="font:600 10.5px/1.2 'Sarabun',sans-serif;letter-spacing:.06em;color:#6B6785;text-transform:uppercase;margin-top:6px">{{ p.brand }}</span>
                <span style="font-size:14px;font-weight:500;line-height:1.4;color:#1E1A3A;text-wrap:pretty">{{ p.name }}</span>
                <span style="margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:2px">
                  <span style="font:700 16px/1.3 'Sarabun',sans-serif;color:#44359B">{{ p.priceLabel }}</span>
                  <span style="font-size:12px;font-weight:600;color:{{ p.stockColor }}">{{ p.stockLabel }}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </section>

        <section data-screen-label="Categories" style="display:flex;flex-direction:column;gap:14px;margin-top:8px">
          <h2 style="margin:0;font-size:22px;font-weight:700;color:#1E1A3A">{{ lblAllCats }}</h2>
          <nav aria-label="categories" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px">
            <sc-for list="{{ circleCats }}" as="c" hint-placeholder-count="9">
              <button type="button" onClick="{{ c.go }}" style="background:#FFFFFF;border:1px solid #ECE9F4;border-radius:16px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer" style-hover="box-shadow:0 8px 22px rgba(68,53,155,.14);border-color:#C9C1EC">
                <span style="width:104px;height:104px;max-width:100%;border-radius:50%;background:#ECE9F8;position:relative;overflow:hidden;display:block;border:2px solid #FFFFFF;box-shadow:0 0 0 1px #E4E1EE"><img src="{{ c.photo }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" /></span>
                <span style="font-size:17px;font-weight:700;color:#1E1A3A;text-align:center;line-height:1.3;text-wrap:balance">{{ c.label }}</span>
              </button>
            </sc-for>
          </nav>
        </section>

        <sc-if value="{{ showCategoryRows }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ homeRows }}" as="row" hint-placeholder-count="3">
          <section style="display:flex;flex-direction:column;gap:14px;margin-top:8px">
            <div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center">
              <h2 style="margin:0;font-size:22px;font-weight:700;color:#1E1A3A">{{ row.title }}</h2>
              <div style="display:flex;flex-wrap:wrap;gap:8px;flex:1">
                <sc-for list="{{ row.pills }}" as="pl" hint-placeholder-count="4">
                  <button type="button" onClick="{{ pl.pick }}" aria-pressed="{{ pl.on }}" style="height:32px;padding:0 14px;border-radius:16px;border:none;background:{{ pl.bg }};color:{{ pl.fg }};font-size:13px;font-weight:600;cursor:pointer">{{ pl.label }}</button>
                </sc-for>
              </div>
              <button type="button" onClick="{{ row.all }}" style="background:none;border:none;color:#44359B;font-size:14px;font-weight:600;cursor:pointer;padding:0">{{ lblSeeAll }} →</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px">
              <button type="button" onClick="{{ row.all }}" style="position:relative;overflow:hidden;border:none;border-radius:14px;min-height:300px;padding:0;cursor:pointer;background:#2E2575;color:#FFFFFF;text-align:left">
                <img src="{{ row.tilePhoto }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" />
                <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,37,117,.55) 0%,rgba(46,37,117,.92) 100%)"></span>
                <span style="position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:6px">
                  <span style="font-size:22px;font-weight:700;line-height:1.2;text-wrap:balance">{{ row.tileTitle }}</span>
                  <span style="font-size:13px;color:#E4DFFF;line-height:1.4">{{ row.tileSub }}</span>
                </span>
              </button>
              <sc-for list="{{ row.items }}" as="p" hint-placeholder-count="5">
                <button type="button" onClick="{{ p.open }}" style="text-align:left;background:#FFFFFF;border:1px solid #ECE9F4;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:300px" style-hover="box-shadow:0 8px 22px rgba(68,53,155,.14)">
                  <span style="aspect-ratio:1/1;width:100%;background:#ECE9F8;border-radius:10px;position:relative;overflow:hidden;display:block"><img src="{{ p.photo }}" alt="" loading="lazy" onError="{{ hideImg }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block" /></span>
                  <span style="font:600 10.5px/1.2 'Sarabun',sans-serif;letter-spacing:.06em;color:#6B6785;text-transform:uppercase;margin-top:6px">{{ p.brand }}</span>
                  <span style="font-size:14px;font-weight:500;line-height:1.4;color:#1E1A3A;text-wrap:pretty">{{ p.name }}</span>
                  <span style="margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:2px">
                    <span style="font:700 16px/1.3 'Sarabun',sans-serif;color:#44359B">{{ p.priceLabel }}</span>
                    <span style="font-size:12px;font-weight:600;color:{{ p.stockColor }}">{{ p.stockLabel }}</span>
                  </span>
                </button>
              </sc-for>
            </div>
          </section>
        </sc-for>
        </sc-if>
      </div>
</x-dc>
</body>
</html>
