  /* ---------- helpers ---------- */
  get lang() { return this.state.lang; }

    const a = this.ACCOUNTS[this.state.acct] || this.ACCOUNTS.guest, rc = this.state.regCo;
    if (a.id === 'bizNew' && rc && rc.company) return { ...a, company:[rc.company, rc.company], taxId:rc.taxId || a.taxId };
    return a;
  }
  get seg() { return this.acct.seg; }

  money(n) { return new Intl.NumberFormat('th-TH', { maximumFractionDigits:0 }).format(Math.round(n || 0)); }
  baht(n) { return this.money(n) + ' บาท'; }
  num(n, d) { return new Intl.NumberFormat('th-TH', { maximumFractionDigits:d === undefined ? 0 : d }).format(n || 0); }
  dateStr(iso) {
    if (!iso) return '—';
    const dt = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    return dt.toLocaleDateString(this.lang === 'en' ? 'en-GB' : 'th-TH', { day:'2-digit', month:'short', year:'numeric' });
  }
  addDays(n) { return new Date(Date.now() + n * 86400000).toISOString().slice(0, 10); }
  price(p) { const v = p.pr[this.acct.priceIdx]; return v === null ? null : v; }
  retail(p) { return p.pr[0]; }
  stockOf(p) { return p.stock === null ? null : Math.max(0, p.stock + (this.state.stockAdj[p.id] || 0)); }
  cartQty(p, requested, current) {
    const min = p.moq || 1, existing = current || 0;
    const wanted = Math.max(min, Math.min(999, Number(requested) || min));
    const ready = this.stockOf(p);
    if (ready === null || p.type === 'pkg' || wanted <= existing) return wanted;
    if (existing === 0 && ready < min) return 0;
    return Math.min(wanted, Math.max(existing, ready));
  }
  stockLimitMsg(p) {
    const ready = this.stockOf(p), unit = this.tx(p.u);
    if (ready === 0) return this.m('สินค้านี้ยังไม่มีจำนวนพร้อมส่ง จึงไม่สามารถเพิ่มลงตะกร้าได้', 'This item has no ready stock and cannot be added to the cart.');
    return this.m('สินค้านี้พร้อมส่ง ' + ready + ' ' + unit + ' ระบบจึงจำกัดจำนวนในตะกร้าไม่เกินจำนวนพร้อมส่ง', 'This item has ' + ready + ' ' + unit + ' ready to ship, so the cart quantity is limited to the ready stock.');
  }
  prod(id) { return this.PRODUCTS.find(p => p.id === id); }
  isServiceProduct(p) { return !!p && (p.type === 'consult' || p.type === 'pkg'); }
  catalogueProducts() { return this.SHOW_SERVICES ? this.PRODUCTS : this.PRODUCTS.filter(p => !this.isServiceProduct(p)); }

  stockVM(p) {
    const L = this.L, i = this.li, st = this.stockOf(p);
    if (p.type === 'consult') return { label:this.tx(L.consultOnly), color:'#44359B', n:null };
    if (p.type === 'pkg') return { label:this.m('งานบริการ · นัดหมายหลังยืนยันคำสั่งซื้อ', 'Service · scheduled after order'), color:'#44359B', n:null };
    if (st === null) return { label:'—', color:'#6B6785', n:null };
    if (st === 0) return { label:this.tx(L.preorderLabel) + ' · ' + this.tx(L.outOfStock), color:'#B87A07', n:0 };
    if (st <= 5) return { label:this.tx(L.lowStock) + ' · ' + st + ' ' + this.tx(L.stockUnit), color:'#B23A2E', n:st };
    return { label:this.tx(L.inStock) + ' · ' + st + ' ' + this.tx(L.stockUnit), color:'#1F7A4D', n:st };
  }

  priceVM(p) {
    const L = this.L, pr = this.price(p);
    if (pr === null) return { priceLabel:this.tx(L.consultOnly), priceNote:this.tx(L.prototypeMockLabel), priceNoteColor:'#6B6785' };
    if (!this.loggedIn) return { priceLabel:this.baht(pr), priceNote:this.tx(L.loginToSee), priceNoteColor:'#B87A07' };
    if (this.seg === 'walkin' || this.seg === 'bizNew') return { priceLabel:this.baht(pr), priceNote:this.tx(L.retailTag), priceNoteColor:'#6B6785' };
    const tag = this.seg === 'partner' ? this.tx(L.partnerPriceTag) : this.tx(L.contractPriceTag);
    const save = this.retail(p) - pr;
    return { priceLabel:this.baht(pr), priceNote:tag + ' · ' + this.tx(L.save0) + ' ' + this.baht(save), priceNoteColor:'#1F7A4D' };
  }

  relTime(ts) {
    const L = this.L, s = Math.max(0, Math.round((this.state.now - ts) / 1000));
    if (s < 60) return this.tx(L.updatedPrefix) + ' ' + this.tx(L.secondsAgo);
    return this.tx(L.updatedPrefix) + ' ' + Math.floor(s / 60) + ' ' + this.tx(L.minutesAgo);
  }

  /* ---------- navigation & chrome ---------- */
  urlPart(value) { return encodeURIComponent(String(value || '')); }
  pathPart(value) { try { return decodeURIComponent(value || ''); } catch (e) { return ''; } }

  urlForNavigation(route, tab) {
    const r = route || { p:'home' };
    if (r.p === 'home') return '/';
    if (r.p === 'pdp') return '/products/' + this.urlPart(r.id);
    if (r.p === 'services') return r.svc ? '/services/' + this.urlPart(r.svc) : '/services';
    if (r.p === 'promos') return '/promotions';
    if (r.p === 'success') return '/order-success';
    if (r.p === 'rfq') return '/request-a-quote';
    if (r.p === 'register') {
      const kind = r.kind || r.done || 'person';
      return '/register/' + this.urlPart(kind) + (r.done ? '/success' : '');
    }
    if (r.p === 'account') {
      if (r.oid) return '/account/orders/' + this.urlPart(r.oid);
      if (r.qid) return '/account/quotes/' + this.urlPart(r.qid);
      if (r.lid) return '/account/consultations/' + this.urlPart(r.lid);
      return { address:'/account/addresses', credit:'/account/credit', orders:'/account/orders', quotes:'/account/quotes', leads:'/account/consultations', docs:'/account/documents', notif:'/account/notifications' }[tab] || '/account';
    }
    const paths = { products:'/products', about:'/about', contact:'/contact', coupons:'/coupons', cart:'/cart', checkout:'/checkout' };
    return Object.hasOwn(paths, r.p) ? paths[r.p] : '/';
  }

  navigationFromPath(pathname) {
    const clean = ('/' + String(pathname || '/').replace(/^\/+|\/+$/g, '')).replace(/\/index\.html$/i, '/');
    const parts = clean.split('/').filter(Boolean);
    if (!parts.length) return { route:{ p:'home' }, tab:'profile' };
    if (parts[0] === 'products') return { route:parts[1] ? { p:'pdp', id:this.pathPart(parts.slice(1).join('/')) } : { p:'products' }, tab:'profile' };
    if (parts[0] === 'services') return { route:{ p:'services', ...(parts[1] ? { svc:this.pathPart(parts[1]) } : {}) }, tab:'profile' };
    if (parts[0] === 'register') {
      const kind = parts[1] === 'company' ? 'company' : 'person';
      return { route:{ p:'register', ...(parts[2] === 'success' ? { done:kind } : { kind }) }, tab:'profile' };
    }
    if (parts[0] === 'account') {
      if (parts[1] === 'orders') return { route:parts[2] ? { p:'account', oid:this.pathPart(parts.slice(2).join('/')) } : { p:'account' }, tab:'orders' };
      if (parts[1] === 'quotes') return { route:parts[2] ? { p:'account', qid:this.pathPart(parts.slice(2).join('/')) } : { p:'account' }, tab:'quotes' };
      if (parts[1] === 'consultations') return { route:parts[2] ? { p:'account', lid:this.pathPart(parts.slice(2).join('/')) } : { p:'account' }, tab:'leads' };
      const accountTabs = { addresses:'address', credit:'credit', documents:'docs', notifications:'notif' };
      return { route:{ p:'account' }, tab:Object.hasOwn(accountTabs, parts[1]) ? accountTabs[parts[1]] : 'profile' };
    }
    const pages = { promotions:'promos', about:'about', contact:'contact', coupons:'coupons', cart:'cart', checkout:'checkout', 'order-success':'success', 'request-a-quote':'rfq' };
    return { route:{ p:Object.hasOwn(pages, parts[0]) ? pages[parts[0]] : 'home' }, tab:'profile' };
  }

  syncBrowserUrl(route, tab, replace) {
    if (!window.history || !window.location) return;
    const url = this.urlForNavigation(route || this.state.route, tab || this.state.tab);
    const current = window.location.pathname || '/';
    if (current === url && !replace) return;
    window.history[replace ? 'replaceState' : 'pushState']({ storefront:true }, '', url);
  }

  go(p, extra) {
    if (p === 'login') { this.openLogin(extra); return; }
    if (!this.SHOW_SERVICES && p === 'services') { p = 'home'; extra = null; }
    if (!this.SHOW_SERVICES && p === 'pdp' && this.isServiceProduct(this.prod(extra && extra.id))) { p = 'products'; extra = null; }
    this.setState(s => ({ route:{ p, ...(extra || {}) }, menuOpen:false, changes:null, searchOpen:false, langOpen:false, acctOpen:false, notifOpen:false }));
    window.scrollTo(0, 0);
  }
  openLogin = (o) => this.setState({ loginModal:{ ...(o || {}) }, menuOpen:false, searchOpen:false, langOpen:false, acctOpen:false, notifOpen:false });
  closeLogin = () => this.setState({ loginModal:null });
  closeMenus = () => this.setState({ searchOpen:false, langOpen:false, acctOpen:false, notifOpen:false });
  say(msg, kind) { this.setState({ toast:msg, toastKind:kind || 'ok' }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast:null }), 4200); }

  api(key, ms, fail, onOk) {
    this.setState(s => ({ api:{ ...s.api, [key]:'loading' } }));
    clearTimeout(this['_a' + key]);
    this['_a' + key] = setTimeout(() => {
      if (Math.random() < fail) {
        this.setState(s => ({ api:{ ...s.api, [key]:'error' }, lastFail:{ key, ms, fail } }));
      } else {
        this.setState(s => ({ api:{ ...s.api, [key]:'ok' } }));
        if (onOk) onOk();
      }
    }, ms);
    this['_k' + key] = onOk;
  }
  retryApi = () => { const f = this.state.lastFail; if (f) this.api(f.key, f.ms, 0, this['_k' + f.key]); };

  /* ---------- cart ---------- */
  get quoteRef() { const r = this.state.ck.quoteRef; return r ? (this.state.quotes.find(q => q.id === r.id) || null) : null; }
  weightOf(items) {
    let kg = 0; const missing = [];
    (items || []).forEach(it => {
      const p = this.prod(it.id); if (!p || p.type === 'pkg' || p.type === 'consult') return;
      if (p.w === null || p.w === undefined) missing.push(this.tx(p.n)); else kg += p.w * it.q;
    });
    return { kg, missing, over:kg > this.MAXW, blocked:kg > this.MAXW || missing.length > 0 };
  }
  weightMsg() { return this.m('น้ำหนักสินค้ารวมเกิน 300 กิโลกรัมต่อคำสั่งซื้อ กรุณาปรับจำนวนสินค้า หรือขอคำปรึกษาเพื่อให้เจ้าหน้าที่แนะนำการสั่งซื้อและการจัดส่ง', 'Total product weight exceeds 300 kg per order. Please adjust quantities, or request a consultation so our team can advise on ordering and delivery.'); }
  missingMsg() { return this.m('สินค้าบางรายการยังไม่มีข้อมูลน้ำหนัก ระบบจึงยังตรวจสอบน้ำหนักรวมไม่ได้ กรุณาขอคำปรึกษาก่อนยืนยันสั่งซื้อ', 'Some items have no weight data, so the total weight cannot be verified. Please request a consultation before confirming the order.'); }
  lockMsg() { return this.m('รายการนี้อ้างอิงใบเสนอราคาที่ตกลงแล้ว การแก้จำนวนหรือรายการต้องขอแก้ไขใบเสนอราคาเพื่อยืนยันราคาใหม่', 'These lines follow an agreed quotation. Changing quantities or items needs a quotation revision to confirm a new price.'); }
  visibleCartLines(lines) { return (lines || []).filter(line => this.SHOW_SERVICES || !this.isServiceProduct(this.prod(line.id))); }
  selectedCart() { return this.visibleCartLines(this.state.cart).filter(l => l.selected !== false); }
  cartWithSelection(items, current) {
    const ids = items.map(i => i.id);
    const unselected = current.filter(l => ids.indexOf(l.id) < 0).map(l => ({ ...l, selected:false }));
    return unselected.concat(items.map(i => ({ id:i.id, q:i.q, selected:true })));
  }
  cartRows() {

      });

  /* ---------- checkout ---------- */
  toCheckout = () => {
    const t = this.totals();

    if (t.mixed) { this.go('cart'); this.say(this.m('ตะกร้ามีสินค้าที่ต้องเสนอราคา กรุณาเลือกแยกรายการก่อนดำเนินการต่อ', 'Your cart has quote-only items — please split them out first.'), 'warn'); return; }
    if (t.wBlocked) { this.go('cart'); this.say(t.over ? this.weightMsg() : this.missingMsg(), 'warn'); return; }

      email:v('email') || a.email || '',

      taxId:v('taxId') || a.taxId || '',
      branch:v('branch') || (a.branch ? this.tx(a.branch) : (this.lang === 'en' ? 'Head office' : 'สำนักงานใหญ่')),
      contact:v('contact') || (this.loggedIn ? this.tx(a.name) : '') || '',
      shipAddr:this.composeAddr(this.seedAddr()),

  ckSel(kind) {
    const list = this.myAddrs(), id = this.state.ck[kind + 'Id'];

  }
  applyAddr(s, kind, x) {
    if (!x) return {};

  }
  ckPick = (kind, id) => this.setState(s => { const x = this.myAddrs().find(y => y.id === id); const o = this.applyAddr(s, kind, x); return { ck:{ ...s.ck, [kind + 'Id']:id }, addr:{ ...s.addr, ...(o.addr || {}) }, form:{ ...s.form, ...(o.form || {}) } }; });
  taxOn() { const ck = this.state.ck; return ck.tax !== undefined && ck.taxAcct === this.state.acct ? !!ck.tax : !!this.acct.company; }
  toggleTax = () => { const on = this.taxOn(); this.setState(s => ({ ck:{ ...s.ck, tax:!on, taxAcct:s.acct } })); };
  shipSumVM() { const x = this.ckSel('ship'); return x ? { label:x.label, name:x.name, phone:x.phone, text:this.composeAddr(x) } : { label:'—', name:'', phone:'', text:'—' }; }
  ckAddrVals() {
    const mk = kind => { const cur = this.ckSel(kind); return this.myAddrs().map(x => { const on = !!cur && cur.id === x.id;
      return { id:x.id, label:x.label, name:x.name, phone:x.phone, text:this.composeAddr(x), tax:x.tax, sel:on ? 'true' : 'false', bg:on ? '#ECE9F8' : '#FFFFFF', bd:on ? '#44359B' : '#E4E1EE', dot:on ? '#44359B' : 'transparent', pick:() => this.ckPick(kind, x.id) }; }); };
    return { ckShipList:mk('ship'), ckBillList:mk('bill') };
  }
  setStep = n => {
    if (n >= 3) { this.setState(s => { const a = this.applyAddr(s, 'ship', this.ckSel('ship')), b = this.taxOn() ? this.applyAddr(s, 'bill', this.ckSel('bill')) : { form:{ billAddr:'' } }; return { addr:{ ...s.addr, ...(a.addr || {}), ...(b.addr || {}) }, form:{ ...s.form, ...(a.form || {}), ...(b.form || {}) } }; }); }
    const ck = this.state.ck;

    if (n === 4 && ck.pay === 'credit') { const cv = this.creditVM(this.totals().total); if (cv && cv.hold) { this.say(this.m('ยอดเกินวงเงินคงเหลือ กรุณาเลือกชำระทันทีหรือส่งให้ผู้ขายพิจารณาเครดิต', 'This exceeds your available credit — pay now or send it for seller credit review.'), 'warn'); return; } }

  }

  creditSummaryVM(amount) {
    const credit = this.creditVM(amount);
    if (!credit) return null;
    const availablePct = credit.limit > 0 ? Math.max(0, Math.min(100, Math.round(credit.avail / credit.limit * 100))) : 0;

        : low ? this.m('หลังสั่งซื้อ วงเงินคงเหลือน้อยกว่า 10%', 'Less than 10% of your credit limit will remain after this order.')
        : this.m('วงเงินเพียงพอสำหรับคำสั่งซื้อนี้', 'Your credit is sufficient for this order.'),
      availablePctTitle:this.m('สัดส่วนวงเงินพร้อมใช้', 'Available credit ratio'),
      availablePctText:this.m('วงเงินพร้อมใช้ ' + availablePct + '%', availablePct + '% available'),

  visibleNotifs() { return this.SHOW_SERVICES ? this.state.notifs : this.state.notifs.filter(n => !/คำขอคำปรึกษา|งานบริการ|Consultation request|Service quotation|Service order/i.test((n.text || []).join(' '))); }

  nextOrderId(kind = 'goods') {

  confirmOrder = () => {

    this.say(this.m('ผู้ขายยืนยันกำหนดส่งแล้ว (จำลอง) — ดำเนินการขั้นตอนถัดไปได้', 'Seller confirmed the lead time (simulated) — continue with the next step.'), 'info');

    this.say(how === 'qr' ? this.m('สแกน QR แล้ว (จำลอง) — รอฝ่ายบัญชียืนยันยอด ยังไม่ถือว่าชำระสำเร็จ', 'QR scanned (simulated) — awaiting confirmation; not yet marked paid.') : this.m('แนบสลิปแล้ว (จำลอง) — รอฝ่ายบัญชีตรวจสอบ', 'Slip uploaded (simulated) — awaiting verification.'), 'info');
    clearTimeout(this['_v' + id]); this['_v' + id] = setTimeout(() => this.verifyPay(id), 2800);

  /* ---------- filtering ---------- */
  filtered() {
    const f = this.state.filters, q = (this.state.search || '').trim().toLowerCase();
    let list = this.catalogueProducts().slice();
    if (q) list = list.filter(p => (this.tx(p.n) + ' ' + p.n[0] + ' ' + p.n[1] + ' ' + p.sku + ' ' + p.brand).toLowerCase().indexOf(q) >= 0);
    const A = this.arr;
    if (A(f.cat).length) list = list.filter(p => A(f.cat).indexOf(this.shopCategory(p)) >= 0);
    if (A(f.brand).length) list = list.filter(p => A(f.brand).indexOf(p.brand) >= 0);
    if (A(f.type).length) list = list.filter(p => A(f.type).indexOf(p.type) >= 0);
    if (f.min) list = list.filter(p => (this.price(p) || 0) >= Number(f.min));
    if (f.max) list = list.filter(p => (this.price(p) || 0) <= Number(f.max));
    if (A(f.avail).length === 1) list = A(f.avail)[0] === 'ready' ? list.filter(p => (this.stockOf(p) || 0) > 0) : list.filter(p => this.stockOf(p) === 0);
    const s = f.sort;
    if (s === 'priceAsc') list.sort((a, b) => (this.price(a) || 1e12) - (this.price(b) || 1e12));
    else if (s === 'priceDesc') list.sort((a, b) => (this.price(b) || 0) - (this.price(a) || 0));
    else if (s === 'name') list.sort((a, b) => this.tx(a.n).localeCompare(this.tx(b.n)));
    else list.sort((a, b) => b.pop - a.pop);
    return list;
  }
