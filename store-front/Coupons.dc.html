<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div data-screen-label="Coupon list" class="pt-container" style="padding:28px var(--pt-content-gutter) 52px;display:flex;flex-direction:column;gap:18px">
        <button type="button" onClick="{{ goHomePage }}" style="align-self:flex-start;background:none;border:none;color:#44359B;font-size:14px;font-weight:600;cursor:pointer;padding:0">← {{ lblBackHome }}</button>
        <div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:clamp(22px,3vw,30px);font-weight:700">{{ lblAllCoupons }}</h1><span style="font-size:14px;color:#4A4766">{{ lblCouponSub }}</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px">
          <sc-for list="{{ couponAll }}" as="cp" hint-placeholder-count="8">
            <div style="display:flex;background:#FFFFFF;border:1px solid #ECE9F4;border-radius:14px;overflow:hidden;opacity:{{ cp.dim }}">
              <div style="flex:none;width:96px;background:#44359B;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:12px 6px;font:700 24px/1.1 'Sarabun',sans-serif;text-align:center;border-right:2px dashed #C9C1EC">{{ cp.value }}</div>
              <div style="flex:1;min-width:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px">
                <div><div style="font-size:16px;font-weight:700;color:#1E1A3A;line-height:1.3">{{ cp.title }}</div><div style="font-size:13px;color:#4A4766;margin-top:3px;line-height:1.4">{{ cp.cond }}</div></div>
                <button type="button" disabled="{{ cp.off }}" onClick="{{ cp.collect }}" style="align-self:flex-start;min-height:40px;padding:0 18px;border:none;border-radius:20px;font-size:14px;font-weight:600;background:{{ cp.bg }};color:{{ cp.fg }};cursor:{{ cp.cursor }}">{{ cp.label }}</button>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
</x-dc>
</body>
</html>
