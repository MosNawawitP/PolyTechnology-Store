<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div role="dialog" aria-modal="true" aria-label="{{ loginTitle }}" onClick="{{ closeLogin }}" style="position:fixed;inset:0;z-index:90;background:rgba(30,26,58,.5);display:flex;align-items:center;justify-content:center;padding:20px">
        <div onClick="{{ stopProp }}" style="background:#FFFFFF;border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 20px 50px rgba(30,26,58,.35)">
          <div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
            <h2 style="margin:0;font-size:22px;font-weight:700;color:#1E1A3A">{{ loginTitle }}</h2>
            <button type="button" onClick="{{ closeLogin }}" aria-label="{{ t.close }}" style="flex:0 0 auto;width:36px;height:36px;background:#F1EFF7;border:none;border-radius:8px;font-size:16px;color:#36334F;cursor:pointer">✕</button>
          </div>
          <p style="margin:0 0 18px;font-size:13px;line-height:1.6;color:#6B6785;text-wrap:pretty">{{ loginIntroShort }}</p>
          <form onSubmit="{{ submitLogin }}" style="display:grid;gap:14px">
            <div>
              <label for="loEmail" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblEmailField }}</label>
              <input id="loEmail" type="email" name="email" value="{{ f.email }}" onChange="{{ onForm }}" autoComplete="email" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" />
            </div>
            <div>
              <label for="loPw" style="display:block;font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:5px">{{ lblPassword }}</label>
              <input id="loPw" type="password" autoComplete="current-password" style="width:100%;height:46px;border:1px solid #D9D5E6;border-radius:8px;padding:0 11px;background:#F9F8FC" />
            </div>
            <div style="display:flex;justify-content:flex-end">
              <button type="button" onClick="{{ forgot }}" style="background:none;border:none;padding:0;color:#44359B;font-size:13.5px;font-weight:600;cursor:pointer">{{ lblForgot }}</button>
            </div>
            <button type="submit" style="min-height:48px;background:#44359B;color:#FFFFFF;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer" style-hover="background:#36297F">{{ loginTitle }}</button>
          </form>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid #E4E1EE">
            <div style="font-size:12.5px;font-weight:600;color:#4A4766;margin-bottom:8px">{{ lblDemoPick }}</div>
            <div style="display:grid;gap:6px">
              <sc-for list="{{ loginOptions }}" as="lo" hint-placeholder-count="4">
                <button type="button" onClick="{{ lo.pick }}" style="display:flex;gap:10px;align-items:center;text-align:left;background:#FFFFFF;border:1px solid #E4E1EE;border-radius:9px;padding:9px 11px;cursor:pointer;min-height:44px" style-hover="border-color:#44359B">
                  <span style="flex:0 0 auto;min-width:78px;text-align:center;font:600 11px/1 'Sarabun',sans-serif;color:#1E1A3A;background:#DDD6F7;border-radius:5px;padding:6px 8px">{{ lo.chip }}</span>
                  <span style="min-width:0;flex:1;font-size:13px;font-weight:600;color:#1E1A3A;line-height:1.35">{{ lo.name }}</span>
                </button>
              </sc-for>
            </div>
          </div>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid #E4E1EE;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between">
            <span style="font-size:14px;color:#4A4766">{{ lblNotMember }}</span>
            <button type="button" onClick="{{ goRegisterFromModal }}" style="min-height:44px;padding:0 20px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:14px;font-weight:700;color:#1E1A3A;cursor:pointer" style-hover="background:#ECE9F8">{{ t.register }}</button>
          </div>
        </div>
      </div>
</x-dc>
</body>
</html>
