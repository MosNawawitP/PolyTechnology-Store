<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
            <section style="flex:1.4 1 380px;min-width:0;background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:20px">
              <h2 style="margin:0 0 16px;font-size:17px;font-weight:700">{{ lblCreditOverview }}</h2>
              <dl style="margin:0 0 18px;display:grid;gap:1px;background:#ECEAF3;border:1px solid #ECEAF3;border-radius:10px;overflow:hidden">
                <sc-for list="{{ creditRows }}" as="cr" hint-placeholder-count="4">
                  <div style="background:#FFFFFF;display:flex;flex-wrap:wrap;gap:8px;padding:12px 13px">
                    <dt style="flex:0 0 45%;min-width:130px;font-size:13.5px;color:#6B6785">{{ cr.k }}</dt>
                    <dd style="margin:0;flex:1 1 40%;font:600 14.5px/1.4 'Sarabun',sans-serif">{{ cr.v }}</dd>
                  </div>
                </sc-for>
              </dl>
              <div style="font-size:12.5px;font-weight:600;color:#4A4766">{{ lblUsagePct }} · {{ creditPct }}</div>
              <div style="height:11px;border-radius:6px;background:#ECEAF3;margin-top:8px;overflow:hidden">
                <div style="height:100%;width:{{ creditPct }};background:#44359B"></div>
              </div>
              <h3 style="margin:22px 0 12px;font-size:15px;font-weight:700">{{ lblUsageRecent }}</h3>
              <div style="display:grid;gap:9px">
                <sc-for list="{{ creditUsage }}" as="cu" hint-placeholder-count="2">
                  <div style="display:flex;flex-wrap:wrap;gap:11px;align-items:center;border:1px solid #ECEAF3;border-radius:9px;padding:12px">
                    <button type="button" onClick="{{ cu.open }}" style="background:none;border:none;padding:0;font:600 13px/1 'Sarabun',sans-serif;color:#44359B;cursor:pointer">{{ cu.id }}</button>
                    <span style="font-size:12.5px;color:#6B6785">{{ cu.date }}</span>
                    <span style="font-size:12.5px;color:#5B49C4;font-weight:600">{{ cu.status }}</span>
                    <span style="font:600 14px/1 'Sarabun',sans-serif;margin-left:auto">{{ cu.amount }}</span>
                  </div>
                </sc-for>
              </div>
            </section>
            <section style="flex:1 1 280px;min-width:0;background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:20px">
              <h2 style="margin:0 0 14px;font-size:16px;font-weight:700">{{ lblDueSoon }}</h2>
              <div style="display:grid;gap:10px">
                <sc-for list="{{ dueInvoices }}" as="di" hint-placeholder-count="2">
                  <div style="border:1px solid #ECEAF3;border-radius:10px;padding:14px">
                    <div style="font:600 13.5px/1 'Sarabun',sans-serif;color:#1E1A3A">{{ di.no }}</div>
                    <div style="font-size:12.5px;color:#6B6785;margin-top:6px">{{ lblDue }}: {{ di.due }} · {{ di.ref }}</div>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px">
                      <span style="font:600 16px/1 'Sarabun',sans-serif">{{ di.amount }}</span>
                      <button type="button" onClick="{{ di.dl }}" style="margin-left:auto;min-height:40px;padding:0 13px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer">{{ lblDownload }}</button>
                    </div>
                  </div>
                </sc-for>
              </div>
            </section>
          </div>
</x-dc>
</body>
</html>
