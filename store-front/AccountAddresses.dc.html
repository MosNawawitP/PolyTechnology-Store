<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
          <section style="background:#FFFFFF;border:1px solid #E4E1EE;border-radius:12px;padding:22px">
            <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px">
              <div>
                <h2 style="margin:0 0 4px;font-size:18px;font-weight:700">{{ lblAddrTitle }}</h2>
                <p style="margin:0;font-size:13px;color:#6B6785">{{ lblAddrSub }}</p>
              </div>
              <button type="button" onClick="{{ openAddrNew }}" style="min-height:46px;padding:0 18px;background:#44359B;border:1px solid #2F2380;border-radius:9px;font-size:14px;font-weight:700;color:#FFFFFF;cursor:pointer">+ {{ lblAddAddr }}</button>
            </div>
            <sc-if value="{{ noAddrs }}"><div style="border:1px dashed #D9D5E6;border-radius:10px;padding:30px;text-align:center;font-size:14px;color:#6B6785">{{ lblNoAddr }}</div></sc-if>
            <div style="display:grid;gap:12px">
              <sc-for list="{{ addrList }}" as="ad" hint-placeholder-count="2">
                <article style="border:1px solid #E4E1EE;border-radius:10px;padding:16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start">
                  <div style="flex:1 1 280px;min-width:0">
                    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
                      <span style="font-size:15px;font-weight:700;color:#1E1A3A">{{ ad.label }}</span>
                      <sc-if value="{{ ad.tax }}"><span style="font:600 11.5px/1 'Sarabun',sans-serif;color:#0A3D22;background:#CDEBD9;border-radius:5px;padding:5px 8px">{{ lblTaxBadge }}</span></sc-if>
                    </div>
                    <div style="font-size:13px;color:#6B6785;margin-top:6px">{{ ad.name }} · {{ ad.phone }}</div>
                    <div style="font-size:14px;line-height:1.6;color:#36334F;margin-top:6px;text-wrap:pretty">{{ ad.text }}</div>
                  </div>
                  <div style="display:flex;gap:8px;flex:0 0 auto">
                    <button type="button" onClick="{{ ad.edit }}" style="min-height:40px;padding:0 14px;background:#F1EFF7;border:1px solid #D9D5E6;border-radius:8px;font-size:13px;font-weight:600;color:#1E1A3A;cursor:pointer">{{ lblEdit }}</button>
                    <button type="button" onClick="{{ ad.del }}" style="min-height:40px;padding:0 14px;background:#FFFFFF;border:1px solid #E4B5AD;border-radius:8px;font-size:13px;font-weight:600;color:#B23A2E;cursor:pointer">{{ lblDelete }}</button>
                  </div>
                </article>
              </sc-for>
            </div>
          </section>
</x-dc>
</body>
</html>
